<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遗语 · 塞拉</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #0a0806;
    background-image: radial-gradient(ellipse at 50% -20%, #241b12 0%, transparent 60%);
    color: #ddd3c4;
    font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
    padding: 24px 16px 60px;
    display: flex;
    justify-content: center;
  }

  .app { width: min(1180px, 100%); }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 16px;
    border-bottom: 1px solid #2a2118;
    margin-bottom: 24px;
  }

  .brand {
    font-size: 22px;
    letter-spacing: 0.4em;
    color: #c8a24a;
    text-shadow: 0 0 24px #c8a24a44;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .progress {
    font-size: 13px;
    color: #8a7f6e;
    letter-spacing: 0.15em;
  }

  .progress.special {
    color: #d97070;
    letter-spacing: 0.3em;
    animation: progressPulse 1.6s infinite;
    text-shadow: 0 0 18px #d9707066;
  }

  @keyframes progressPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  .btn-restart {
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.2em;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    background: transparent;
    border: 1px solid #332a1e;
    color: #8a7f6e;
    transition: all .18s;
  }

  .btn-restart:hover {
    border-color: #c8a24a;
    color: #c8a24a;
  }

  .grid {
    display: grid;
    grid-template-columns: 1.05fr 1.2fr 0.8fr;
    gap: 18px;
    align-items: start;
  }

  @media (max-width: 980px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: linear-gradient(180deg, #16120d, #110e0a);
    border: 1px solid #2a2118;
    border-radius: 10px;
    padding: 20px;
    min-height: 120px;
  }

  .panel h2 {
    font-size: 12px;
    letter-spacing: 0.3em;
    color: #8a7f6e;
    font-weight: normal;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid #241d15;
  }

  .scene-img-wrap {
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    background: #0d0b08;
    border: 1px solid #241d15;
    margin-bottom: 16px;
    min-height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scene-img-wrap img {
    width: 100%;
    height: auto;
    display: block;
  }

  .img-placeholder {
    padding: 28px 20px;
    text-align: center;
    color: #6d6355;
    font-size: 13px;
    line-height: 1.9;
    width: 100%;
  }

  .img-placeholder .ph-icon {
    font-size: 30px;
    opacity: 0.35;
    margin-bottom: 10px;
  }

  .img-placeholder .ph-file {
    color: #c8a24a;
    font-family: "Courier New", monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
    word-break: break-all;
  }

  #clueTitle {
    font-size: 18px;
    color: #e8c876;
    margin-bottom: 12px;
    letter-spacing: 0.1em;
  }

  #clueText {
    font-size: 14px;
    line-height: 2;
    color: #b3a894;
    white-space: pre-line;
  }

  .sela {
    font-family: "Courier New", ui-monospace, monospace;
    letter-spacing: 0.2em;
    color: #e8c876;
    font-size: 17px;
    font-weight: bold;
  }

  .line {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 14px 0;
    border-bottom: 1px dashed #241d15;
  }

  .line:last-of-type { border-bottom: none; }

  .tag {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: #6d6355;
    border: 1px solid #332a1e;
    border-radius: 3px;
    padding: 3px 8px;
    flex-shrink: 0;
  }

  .eq { color: #6d6355; }
  .cn { color: #ddd3c4; font-size: 16px; }

  .input-row {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  input[type="text"] {
    flex: 1;
    background: #0d0b08;
    border: 1px solid #332a1e;
    border-radius: 6px;
    padding: 12px 14px;
    color: #e8c876;
    font-family: inherit;
    font-size: 16px;
    outline: none;
    transition: border-color .2s;
    min-width: 0;
  }

  input[type="text"]:focus { border-color: #c8a24a; }
  input[type="text"]::placeholder { color: #4d453a; }

  .btn {
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.1em;
    padding: 12px 22px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all .18s;
    white-space: nowrap;
  }

  .btn.primary {
    background: #c8a24a;
    color: #0a0806;
    font-weight: bold;
  }

  .btn.primary:hover { background: #e8c876; }
  .btn.primary:disabled { opacity: 0.5; cursor: default; }

  .btn.ghost {
    background: transparent;
    border-color: #332a1e;
    color: #8a7f6e;
    margin-top: 14px;
    font-size: 13px;
    padding: 8px 16px;
  }

  .btn.ghost:hover { border-color: #c8a24a; color: #c8a24a; }

  .feedback {
    min-height: 22px;
    margin-top: 12px;
    font-size: 14px;
    color: #d97070;
    line-height: 1.7;
  }

  .feedback.good { color: #6fbf73; }

  .no-hint {
    margin-top: 14px;
    font-size: 12px;
    color: #6d6355;
    letter-spacing: 0.2em;
    font-style: italic;
  }

  /* 单词卡 */
  .word-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
    margin-top: 8px;
  }

  .word-card {
    background: #0d0b08;
    border: 1px solid #332a1e;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    transition: all .35s;
  }

  .word-card.revealed {
    border-color: #c8a24a66;
    box-shadow: 0 0 26px #c8a24a22;
  }

  .word-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 6px;
    overflow: hidden;
    background: #16120d;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .word-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .word-img-ph {
    padding: 10px;
    color: #6d6355;
    font-size: 11px;
    line-height: 1.6;
    text-align: center;
  }

  .word-img-ph .ph-icon {
    font-size: 22px;
    opacity: 0.35;
    margin-bottom: 6px;
  }

  .word-img-ph .ph-file {
    color: #c8a24a;
    font-family: monospace;
    font-size: 10px;
    word-break: break-all;
    margin-bottom: 4px;
  }

  .word-sela {
    font-family: "Courier New", monospace;
    font-size: 22px;
    letter-spacing: 0.2em;
    color: #e8c876;
    font-weight: bold;
    margin-bottom: 8px;
  }

  .word-input {
    width: 100%;
    background: #0d0b08;
    border: 1px solid #332a1e;
    border-radius: 6px;
    padding: 8px 10px;
    color: #e8c876;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    text-align: center;
    margin-bottom: 8px;
    transition: all .2s;
  }

  .word-input:focus { border-color: #c8a24a; }
  .word-input::placeholder { color: #4d453a; }
  .word-input:disabled {
    background: #101a10;
    color: #6fbf73;
    border-color: #3a5c3c;
    cursor: default;
  }

  .reveal-btn {
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.15em;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    background: transparent;
    border: 1px solid #332a1e;
    color: #8a7f6e;
    transition: all .18s;
    width: 100%;
  }

  .reveal-btn:hover { border-color: #c8a24a; color: #c8a24a; }

  .word-feedback {
    min-height: 18px;
    font-size: 12px;
    color: #d97070;
    margin-top: 6px;
    line-height: 1.5;
  }

  .word-feedback.good { color: #6fbf73; }

  /* 构词关 */
  .compound-known {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    padding: 12px 14px;
    background: #0d0b08;
    border: 1px solid #241d15;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 14px;
    color: #a89b86;
  }

  .compound-known-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .compound-known .sela { font-size: 14px; }

  .word-parts {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
    padding: 18px 8px;
    background: #16120d;
    border-radius: 6px;
    margin-bottom: 12px;
    min-height: 80px;
    flex-wrap: wrap;
  }

  .word-parts .sela { font-size: 20px; }

  .word-parts .plus {
    color: #4d453a;
    font-size: 16px;
    margin: 0 2px;
  }

  /* 词典 */
  #lexicon {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 520px;
    overflow-y: auto;
  }

  .lex-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: #0d0b08;
    border-radius: 6px;
    border-left: 2px solid #c8a24a55;
    animation: fadeIn .4s;
  }

  .lex-item .sela { font-size: 15px; }
  .lex-item .cn { font-size: 14px; color: #a89b86; }

  .empty { color: #4d453a; font-size: 14px; line-height: 1.8; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 碑文 */
  .inscription {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 18px 0 8px;
  }

  .insc-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 12px 14px;
    border-radius: 6px;
    background: #0d0b08;
    border: 1px solid transparent;
    opacity: .35;
    transition: all .3s;
  }

  .insc-line.active {
    opacity: 1;
    border-color: #c8a24a55;
    box-shadow: 0 0 20px #c8a24a22;
  }

  .insc-line.done { opacity: 1; border-color: #3a5c3c; }
  .insc-line.done .cn { color: #6fbf73; }

  /* 特殊关 */
  #puzzle.special-mode { position: relative; }

  #puzzle.special-mode::before {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 12px;
    pointer-events: none;
    border: 1px solid #d9707033;
    box-shadow: 0 0 32px #d9707022 inset;
    animation: specialGlow 2.4s infinite;
  }

  @keyframes specialGlow {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 1; }
  }

  #puzzle.special-mode .sela {
    color: #f08484;
    text-shadow: 0 0 16px #d9707055;
  }

  #puzzle.special-mode .line { border-bottom-color: #d9707022; }
  #puzzle.special-mode .tag { border-color: #d9707044; color: #d97070; }

  /* 弹层 */
  .overlay {
    position: fixed;
    inset: 0;
    background: #000000cc;
    display: grid;
    place-items: center;
    padding: 24px;
    z-index: 99;
    animation: fadeIn .3s;
  }

  .reveal-box {
    max-width: 500px;
    background: linear-gradient(180deg, #1a1510, #120f0b);
    border: 1px solid #c8a24a55;
    border-radius: 12px;
    padding: 34px 30px;
    text-align: center;
    box-shadow: 0 0 60px #c8a24a22;
    animation: fadeIn .45s;
  }

  .reveal-box p {
    font-size: 16px;
    line-height: 2;
    color: #ddd3c4;
    margin-bottom: 24px;
    white-space: pre-line;
  }

  .confirm-overlay {
    position: fixed;
    inset: 0;
    background: #000000cc;
    display: grid;
    place-items: center;
    padding: 24px;
    z-index: 100;
    animation: fadeIn .2s;
  }

  .confirm-box {
    max-width: 380px;
    background: linear-gradient(180deg, #1a1510, #120f0b);
    border: 1px solid #c8a24a55;
    border-radius: 12px;
    padding: 30px 28px;
    text-align: center;
    box-shadow: 0 0 60px #c8a24a22;
  }

  .confirm-box p {
    font-size: 15px;
    line-height: 1.9;
    color: #ddd3c4;
    margin-bottom: 24px;
  }

  .confirm-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .confirm-actions .btn { margin-top: 0; }

  .shake { animation: shake .35s; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* 结局 */
  .ending {
    max-width: 640px;
    margin: 60px auto;
    text-align: center;
    animation: fadeIn 1.2s;
  }

  .ending h1 {
    font-size: 26px;
    letter-spacing: 0.4em;
    color: #c8a24a;
    margin-bottom: 44px;
  }

  .ending p {
    font-size: 16px;
    line-height: 2.2;
    color: #b3a894;
    margin-bottom: 12px;
  }

  .ending .ep { margin-top: 30px; color: #ddd3c4; }

  .ending .right p {
    color: #e8c876;
    font-size: 18px;
    letter-spacing: 0.08em;
  }

  .ending .btn { margin-top: 44px; }

  /* 黑影结局 */
  .shadow-scene {
    max-width: 620px;
    margin: 100px auto 0;
    text-align: center;
    animation: fadeIn 1.6s;
  }

  .shadow-figure {
    width: 160px;
    height: 220px;
    margin: 0 auto 56px;
    background: radial-gradient(ellipse at 50% 30%, #1a1a1a 0%, #050505 60%, transparent 100%);
    border-radius: 50% 50% 40% 40%;
    filter: blur(2px);
    animation: shadowBreathe 4s infinite ease-in-out;
  }

  .shadow-figure.fading { animation: shadowFade 2.4s forwards; }

  @keyframes shadowBreathe {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.04); opacity: 1; }
  }

  @keyframes shadowFade {
    0% { transform: scale(1); opacity: 1; filter: blur(2px); }
    100% { transform: scale(1.6); opacity: 0; filter: blur(24px); }
  }

  .shadow-line {
    font-size: 17px;
    line-height: 2.2;
    color: #b3a894;
    letter-spacing: 0.12em;
    margin-bottom: 10px;
    opacity: 0;
    animation: shadowLine 1.4s forwards;
  }

  .shadow-line:nth-child(2) { animation-delay: 1.4s; }
  .shadow-line:nth-child(3) { animation-delay: 2.8s; }
  .shadow-line:nth-child(4) { animation-delay: 4.2s; }

  @keyframes shadowLine {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .signature-box {
    margin-top: 40px;
    display: flex;
    gap: 10px;
    justify-content: center;
    opacity: 0;
    animation: shadowLine 1.4s 5.6s forwards;
  }

  .signature-box input {
    flex: 0 0 220px;
    background: #0d0b08;
    border: 1px solid #332a1e;
    border-radius: 6px;
    padding: 12px 14px;
    color: #e8c876;
    font-family: inherit;
    font-size: 16px;
    outline: none;
    text-align: center;
    letter-spacing: 0.15em;
  }

  .signature-box input:focus { border-color: #c8a24a; }
  .signature-box input::placeholder { color: #4d453a; letter-spacing: 0.08em; }

  .shadow-whisper {
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 15px;
    letter-spacing: 0.4em;
    color: #c8a24a;
    opacity: 0;
    pointer-events: none;
    text-shadow: 0 0 20px #c8a24a66;
    animation: whisper 3.6s ease-in-out;
    z-index: 200;
    white-space: nowrap;
  }

  @keyframes whisper {
    0% { opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* 选择关 */
  .choice-options {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 8px;
  }

  .choice-btn {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    background: #0d0b08;
    border: 1px solid #332a1e;
    border-radius: 10px;
    cursor: pointer;
    transition: all .25s;
    font-family: inherit;
    color: #ddd3c4;
    text-align: left;
    width: 100%;
  }

  .choice-btn:hover {
    border-color: #d97070;
    background: #1a1010;
    box-shadow: 0 0 26px #d9707022;
  }

  .choice-label {
    font-family: "Courier New", monospace;
    font-size: 13px;
    color: #6d6355;
    border: 1px solid #332a1e;
    border-radius: 3px;
    padding: 3px 8px;
    flex-shrink: 0;
  }

  .choice-btn:hover .choice-label {
    border-color: #d97070;
    color: #d97070;
  }

  .choice-sela {
    font-family: "Courier New", monospace;
    font-size: 17px;
    letter-spacing: 0.15em;
    color: #f08484;
    font-weight: bold;
    flex: 1;
  }

  .choice-cn {
    font-size: 14px;
    color: #8a7f6e;
    letter-spacing: 0.1em;
  }

  /* 清档场景 */
  .reset-scene {
    max-width: 560px;
    margin: 140px auto 0;
    text-align: center;
    animation: fadeIn 1s;
  }

  .reset-line {
    font-size: 20px;
    line-height: 2.4;
    letter-spacing: 0.3em;
    color: #8a7f6e;
    opacity: 0;
    animation: resetFade 1.2s forwards;
  }

  .reset-line:nth-child(1) { animation-delay: 0s; }
  .reset-line:nth-child(2) { animation-delay: 1s; }
  .reset-line:nth-child(3) { animation-delay: 2s; }

  .reset-emph {
    color: #d97070;
    text-shadow: 0 0 30px #d9707066;
    font-size: 22px;
  }

  @keyframes resetFade {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 最终考验 */
  .final-speech { padding: 16px 0 4px; }

  .final-line {
    font-size: 15px;
    line-height: 2.2;
    color: #b3a894;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }

  .final-emph {
    color: #d97070;
    font-size: 16px;
    letter-spacing: 0.15em;
    margin-top: 14px;
    text-shadow: 0 0 18px #d9707044;
  }

  .final-stage-tag {
    color: #d97070;
    font-size: 13px;
    letter-spacing: 0.25em;
    margin: 26px 0 18px;
  }

  .final-item {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px dashed #241d15;
  }

  .final-item:last-of-type { border-bottom: none; }

  .final-prompt {
    flex: 0 0 100%;
    font-size: 16px;
    color: #e8c876;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
  }

  .final-input {
    flex: 1;
    background: #0d0b08;
    border: 1px solid #332a1e;
    border-radius: 6px;
    padding: 10px 14px;
    color: #e8c876;
    font-family: "Courier New", monospace;
    font-size: 15px;
    letter-spacing: 0.08em;
    outline: none;
    min-width: 0;
  }

  .final-input:focus { border-color: #d97070; }
  .final-input:disabled {
    background: #101a10;
    color: #6fbf73;
    border-color: #3a5c3c;
    cursor: default;
  }

  .final-feedback {
    flex: 0 0 100%;
    min-height: 16px;
    font-size: 12px;
    color: #d97070;
    padding-left: 2px;
  }

  .final-feedback.good { color: #6fbf73; }

  .final-name-box {
    text-align: center;
    padding: 20px 0 30px;
  }

  .final-name-marks {
    font-family: "Courier New", monospace;
    font-size: 42px;
    letter-spacing: 0.5em;
    color: #d97070;
    text-shadow: 0 0 30px #d9707066;
    margin-bottom: 18px;
    transition: all 1.2s;
  }

  .final-name-marks.revealed {
    color: #e8c876;
    text-shadow: 0 0 40px #c8a24aaa;
    letter-spacing: 0.3em;
    animation: nameReveal 1.8s forwards;
  }

/* =========================================================
   状态
   ========================================================= */
const state = {
  level: 0,
  known: [],
  inscStep: 0,
  inscAnswers: [],
  secondRun: false,
  introShown: false,
  levels: LEVELS,
  finalStage: 0,
  finalStep: 0,
  finalAnswers: []
};

const $ = s => document.querySelector(s);

function save() {
  try {
    const lv = state.levels[state.level];
    const data = { known: state.known, level: state.level };
    if (lv && lv.key) data.key = lv.key;
    const saveKey = state.secondRun ? "sela_save_2" : "sela_save";
    localStorage.setItem(saveKey, JSON.stringify(data));
  } catch (e) {}
}

function load() {
  try {
    state.secondRun = !!localStorage.getItem("sela_name");
    state.levels = state.secondRun ? LEVELS_2 : LEVELS;

    const saveKey = state.secondRun ? "sela_save_2" : "sela_save";
    const raw = localStorage.getItem(saveKey);

    if (raw) {
      const d = JSON.parse(raw);
      if (Array.isArray(d.known)) state.known = d.known;

      if (d.key) {
        const idx = state.levels.findIndex(l => l.key === d.key);
        if (idx >= 0) { state.level = idx; return; }
      }
      if (typeof d.level === "number" && d.level >= 0 && d.level < state.levels.length) {
        state.level = d.level;
      }
    }

    // 二周目继承一周目词典
    if (state.secondRun && state.known.length === 0) {
      try {
        const v = localStorage.getItem("sela_vocab");
        if (v) state.known = JSON.parse(v);
      } catch (e) {}
    }
  } catch (e) {}
}

function norm(s) {
  return (s || "")
    .replace(/[\s，。！？、,.!?；;：:"'“”‘’（）()《》「」『』…—\-]/g, "")
    .toLowerCase();
}

/* =========================================================
   图片占位
   ========================================================= */
function placeholderHTML(file, hint) {
  return `<div class="img-placeholder"><div class="ph-icon">🖼</div><div class="ph-file">${file}</div><div>${hint || "（放一张与此关相关的图片）"}</div></div>`;
}

function renderSceneImage(lv) {
  const wrap = $("#imgWrap");
  wrap.innerHTML = "";
  const img = document.createElement("img");
  img.src = lv.image;
  img.alt = lv.imageAlt || lv.title;
  img.loading = "lazy";
  img.onerror = () => { wrap.innerHTML = placeholderHTML(lv.image, lv.imageHint); };
  wrap.appendChild(img);
}

function whisper(text) {
  const el = document.createElement("div");
  el.className = "shadow-whisper";
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3800);
}

/* =========================================================
   渲染主流程
   ========================================================= */
function render() {
  const levels = state.levels;
  if (state.level >= levels.length) return renderEnding();
  const lv = levels[state.level];
  state.inscStep = 0;
  state.inscAnswers = [];

  // 二周目开场低语
  if (state.secondRun && state.level === 0 && !state.introShown) {
    state.introShown = true;
    const name = localStorage.getItem("sela_name");
    if (name) setTimeout(() => whisper(`我记得你，${name}。`), 900);
  }

  // 进度显示
  const prog = $("#progress");
  if (lv.special) {
    prog.textContent = `第 ${lv.label} 号异闻`;
    prog.className = "progress special";
  } else {
    prog.textContent = `第 ${lv.label} 关 / 共 ${levels.length} 关`;
    prog.className = "progress";
  }

  $("#clueTitle").textContent = lv.title;
  const playerName = localStorage.getItem("sela_name") || "";
  $("#clueText").textContent = (lv.scene || "").replace(/\{name\}/g, playerName);
  renderLexicon();

  const p = $("#puzzle");
  p.innerHTML = "";
  p.className = lv.special ? "special-mode" : "";

  if (lv.kind === "word") {
    $("#imgWrap").innerHTML = `<div class="img-placeholder"><div class="ph-icon">📖</div><div style="color:#8a7f6e;margin-top:6px;">词汇学习 · 请看右侧卡片</div></div>`;
    renderWord(lv, p);
  } else if (lv.kind === "compound") {
    $("#imgWrap").innerHTML = `<div class="img-placeholder"><div class="ph-icon">✦</div><div style="color:#8a7f6e;margin-top:6px;">构词 · 观察符号本身</div></div>`;
    renderCompound(lv, p);
  } else if (lv.kind === "choice") {
    $("#imgWrap").innerHTML = `<div class="img-placeholder"><div class="ph-icon">◐</div><div style="color:#d97070;margin-top:6px;">石碑在问你</div></div>`;
    renderChoice(lv, p);
  } else if (lv.kind === "final") {
    $("#imgWrap").innerHTML = `<div class="img-placeholder"><div class="ph-icon">◈</div><div style="color:#d97070;margin-top:6px;">最终考验</div></div>`;
    renderFinal(lv, p);
  } else {
    renderSceneImage(lv);
    if (lv.kind === "translate") renderTranslate(lv, p);
    else renderInscription(lv, p);
  }
}

function renderLexicon() {
  const box = $("#lexicon");
  if (state.known.length === 0) {
    box.innerHTML = `<p class="empty">尚未解读任何词汇。<br>随着你破译石碑，这里会逐渐充实。</p>`;
    return;
  }
  box.innerHTML = state.known.map(w => `<div class="lex-item"><span class="sela">${w}</span><span class="cn">${LEXICON[w] || "?"}</span></div>`).join("");
}

/* ---------- 单词关 ---------- */
function renderWord(lv, p) {
  p.innerHTML = `

    <div class="word-grid" id="wordGrid"></div>
    <div class="feedback" id="feedback"></div>
  `;
  const grid = $("#wordGrid");
  let correctCount = 0;

  lv.words.forEach(item => {
    const card = document.createElement("div");
    card.className = "word-card";

    const imgDiv = document.createElement("div");
    imgDiv.className = "word-img";
    const img = document.createElement("img");
    img.src = item.image;
    img.alt = item.imageAlt || item.word;
    img.onerror = () => {
      imgDiv.innerHTML = `<div class="word-img-ph"><div class="ph-icon">🖼</div><div class="ph-file">${item.image}</div><div>${item.imageHint || ""}</div></div>`;
    };
    imgDiv.appendChild(img);
    card.appendChild(imgDiv);

    const sela = document.createElement("div");
    sela.className = "word-sela";
    sela.textContent = item.word;
    card.appendChild(sela);

    const input = document.createElement("input");
    input.type = "text";
    input.className = "word-input";
    input.placeholder = "输入中文…";
    input.autocomplete = "off";
    input.spellcheck = false;
    card.appendChild(input);

    const btn = document.createElement("button");
    btn.className = "reveal-btn";
    btn.textContent = "确认";
    card.appendChild(btn);

    const fb = document.createElement("div");
    fb.className = "word-feedback";
    card.appendChild(fb);

    const accepts = item.accepts && item.accepts.length ? item.accepts : [item.cn];

    const check = () => {
      if (card.classList.contains("revealed")) return;
      const v = norm(input.value);
      if (!v) return;

      if (accepts.some(a => norm(a) === v)) {
        card.classList.add("revealed");
        input.value = item.cn;
        input.disabled = true;
        btn.style.display = "none";
        fb.className = "word-feedback good";

    grid.appendChild(card);
  });

  const first = grid.querySelector(".word-input");
  if (first) first.focus();
}

/* ---------- 翻译关 ---------- */
function renderTranslate(lv, p) {

  }

    ? `<div class="no-hint">这一关没有提示。</div>`
    : `<button class="btn ghost" id="hintBtn">提示</button>`;

  p.innerHTML = `
    ${knownHTML}
    <div class="line"><span class="tag">待译</span><span class="sela" style="font-size:20px;">${lv.prompt}</span></div>
    <div class="input-row">

    </div>
    <div class="feedback" id="feedback"></div>
    ${hintHTML}
  `;

  const input = $("#answer");
  const submit = () => {
    const v = norm(input.value);
    if (!v) return;
    if (lv.accepts.some(a => norm(a) === v)) {
      $("#feedback").className = "feedback good";
      $("#feedback").textContent = "正确。";
      setTimeout(() => finishLevel(lv), 380);
    } else {

      setTimeout(() => input.classList.remove("shake"), 400);

  };

  $("#submit").onclick = submit;
  input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });

  const hintBtn = $("#hintBtn");
  if (hintBtn) {
    hintBtn.onclick = () => {
      $("#feedback").className = "feedback";
      $("#feedback").textContent = "提示：" + lv.hint;

/* ---------- 碑文关 ---------- */
function renderInscription(lv, p) {
  const draw = () => {
    const hintHTML = lv.hint === null
      ? `<div class="no-hint">这一关没有提示。</div>`
      : `<button class="btn ghost" id="hintBtn">提示</button>`;

    p.innerHTML = `
      <div class="line"><span class="tag">已知</span><span class="sela">${lv.known.text}</span><span class="eq">=</span><span class="cn">${lv.known.cn}</span></div>
      <div class="inscription" id="insc"></div>
      <div class="input-row">
        <input type="text" id="answer" placeholder="逐行翻译碑文…" autocomplete="off" spellcheck="false">
        <button class="btn primary" id="submit">提交</button>
      </div>
      <div class="feedback" id="feedback"></div>
      ${hintHTML}
    `;

    const insc = $("#insc");
    lv.lines.forEach((line, i) => {
      const d = document.createElement("div");
      d.className = "insc-line";
      if (i < state.inscStep) d.classList.add("done");
      if (i === state.inscStep) d.classList.add("active");
      d.innerHTML = `<span class="sela">${line.text}</span>`;
      if (i < state.inscStep) {
        const cn = document.createElement("span");
        cn.className = "cn";
        cn.textContent = state.inscAnswers[i];
        d.appendChild(cn);
      }
      insc.appendChild(d);
    });

    const input = $("#answer");
    const submit = () => {
      const v = norm(input.value);
      if (!v) return;
      const cur = lv.lines[state.inscStep];
      if (cur.accepts.some(a => norm(a) === v)) {
        state.inscAnswers.push(cur.accepts[0]);
        state.inscStep++;
        if (state.inscStep >= lv.lines.length) {
          $("#feedback").className = "feedback good";
          $("#feedback").textContent = "碑文全部译出。";
          setTimeout(() => finishLevel(lv), 500);
        } else {
          draw();
        }
      } else {
        $("#feedback").className = "feedback";
        $("#feedback").textContent = "这一行不对。注意语序，以及修饰词的位置。";
        input.classList.add("shake");
        setTimeout(() => input.classList.remove("shake"), 400);
      }
    };

    $("#submit").onclick = submit;
    input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });

    const hintBtn = $("#hintBtn");
    if (hintBtn) {
      hintBtn.onclick = () => {
        $("#feedback").className = "feedback";
        $("#feedback").textContent = "提示：语序是「（时态）—动词—主语—（修饰词）宾语」。";
      };
    }

    input.focus();
  };

  draw();
}

      <div class="final-name-row">
        <input type="text" id="nameInput" class="final-input" placeholder="写下你的答案…" autocomplete="off" spellcheck="false" maxlength="16">
        <button class="btn primary" id="nameBtn">确认</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  `;

  const input = $("#nameInput");
  const btn = $("#nameBtn");

  const check = () => {
    const v = input.value.trim();
    if (!v) return;
    if (v === name) {
      input.disabled = true;
      btn.disabled = true;
      const marksEl = $("#nameMarks");
      marksEl.textContent = name;
      marksEl.classList.add("revealed");
      setTimeout(() => renderEnding2(), 2200);
    } else {
      $("#feedback").textContent = "不对。问问自己，你是谁。";
      input.classList.add("shake");
      setTimeout(() => input.classList.remove("shake"), 400);
    }
  };

  btn.onclick = check;
  input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  input.focus();
}

/* =========================================================
   过关
   ========================================================= */
function finishLevel(lv) {
  (lv.learned || []).forEach(w => {
    if (!state.known.includes(w)) state.known.push(w);
  });
  if (lv.isFinal) return renderEnding2();
  state.level++;
  save();
  showReveal(lv.reveal, () => {
    if (state.level >= state.levels.length) renderEnding();
    else render();
  });
}

function showReveal(text, cb) {
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="reveal-box"><p>${text}</p><button class="btn primary">继续</button></div>`;
  overlay.querySelector("button").onclick = () => {
    overlay.remove();
    cb();
  };
  document.body.appendChild(overlay);
}

/* =========================================================
   随时重开
   ========================================================= */
function restartGame(skipConfirm) {
  const saveKey = state.secondRun ? "sela_save_2" : "sela_save";

  if (skipConfirm) {
    localStorage.removeItem(saveKey);
    location.reload();
    return;
  }

  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  overlay.innerHTML = `
    <div class="confirm-box">
      <p>确定要重新开始吗？<br>当前的进度会被清空。</p>
      <div class="confirm-actions">
        <button class="btn ghost" id="cancelRestart">取消</button>
        <button class="btn primary" id="confirmRestart">重开</button>
      </div>
    </div>
  `;
  overlay.querySelector("#cancelRestart").onclick = () => overlay.remove();
  overlay.querySelector("#confirmRestart").onclick = () => {
    localStorage.removeItem(saveKey);
    location.reload();
  };
  document.body.appendChild(overlay);
}

document.addEventListener("click", e => {
  if (e.target && e.target.id === "restartBtn") restartGame(false);
});

/* =========================================================
   结局（一周目）
   ========================================================= */
function renderEnding() {
  const app = document.querySelector(".app");
  const name = localStorage.getItem("sela_name");

  const nameLine = (state.secondRun && name)
    ? `<p class="right" style="margin-top:14px;">名字是：<span class="sela">${name}</span></p>`
    : "";

  app.innerHTML = `
    <div class="ending">
      <h1>遗 语 · 塞 拉</h1>
      <p>你读完了碑文。</p>
      <p class="ep">碑上写的，是一个完整的预言——</p>
      <div class="right">
        <p>古代两位神明，居住在高的塔上。</p>
        <p>唯一至高生命，曾在圣诞前夕降临。</p>
        <p>魔鬼迷惑人民，人民转变了信仰。</p>
        <p>如今神明得到复活，末日即将来临。</p>
        <p>神的侍者，将离开笼子。</p>
      </div>
      <p class="ep">你转身，准备离开。</p>
      <p>但石碑的背面，还刻着一个符号。</p>
      <p>你盯着它看了很久，终于认出——</p>
      <p class="right"><span class="sela">va mi ti</span>　我来这里。</p>
      <p class="ep">而落款的笔迹，和你自己的，一模一样。</p>
      ${nameLine}
      <button class="btn primary" id="toShadow">……</button>
    </div>
  `;

  $("#toShadow").onclick = () => showShadow();
}

/* =========================================================
   黑影结局
   ========================================================= */
function showShadow() {
  const app = document.querySelector(".app");
  app.innerHTML = `
    <div class="shadow-scene">
      <div class="shadow-figure"></div>
      <p class="shadow-line">我知道你不在这里。</p>
      <p class="shadow-line">你在对面。</p>
      <p class="shadow-line">签个名吧，我想记住你。</p>
      <div class="signature-box">
        <input type="text" id="signInput" maxlength="16" placeholder="写下你的名字…" autocomplete="off" spellcheck="false">
        <button class="btn primary" id="signBtn">签名</button>
      </div>
    </div>
  `;

  const input = $("#signInput");
  const btn = $("#signBtn");

  const doSign = () => {
    const name = input.value.trim();
    if (!name) {
      input.classList.add("shake");
      setTimeout(() => input.classList.remove("shake"), 400);
      return;
    }
    localStorage.setItem("sela_name", name);

    // 备份一周目词典
    try {
      if (Array.isArray(state.known) && state.known.length > 0) {
        localStorage.setItem("sela_vocab", JSON.stringify(state.known));
      }
    } catch (e) {}

    signAndRestart(name);
  };

  btn.onclick = doSign;
  input.addEventListener("keydown", e => { if (e.key === "Enter") doSign(); });
  setTimeout(() => input.focus(), 5800);
}

function signAndRestart(name) {
  const app = document.querySelector(".app");
  app.innerHTML = `
    <div class="shadow-scene">
      <div class="shadow-figure fading"></div>
      <p class="shadow-line" style="animation-delay: 0.4s;">我记住了，${name}。</p>
      <p class="shadow-line" style="animation-delay: 2s;">再见。</p>
      <button class="btn ghost" id="restartOnly" style="margin-top: 60px; opacity: 0; animation: shadowLine 1.4s 3.6s forwards;">重新开始</button>
    </div>
  `;

  $("#restartOnly").onclick = () => {
    localStorage.removeItem("sela_save");
    localStorage.removeItem("sela_save_2");
    location.reload();
  };
}

/* =========================================================
   结局 2 · 双生一体
   ========================================================= */
function renderEnding2() {
  const app = document.querySelector(".app");
  const name = localStorage.getItem("sela_name") || "旅人";

  app.innerHTML = `
    <div class="ending ending-final">
      <h1 class="final-title">双 生 一 体</h1>

      <p class="ep">你融入了塞拉。</p>
      <p class="right" style="margin: 24px 0;">
        <span class="sela" style="font-size: 22px;">${name} = Sela</span>
      </p>
      <p>你即塞拉，塞拉即你。</p>
      <p class="ep">无论明天是什么样的，你们……</p>
      <p class="right"><span class="sela" style="font-size: 22px;">phi</span></p>

      <p class="ep ending-tag">结 局 二 / 二</p>

      <button class="btn ghost" id="finalRestart" style="margin-top: 40px;">重新开始</button>
    </div>
  `;

  $("#finalRestart").onclick = () => {
    localStorage.removeItem("sela_save");
    localStorage.removeItem("sela_save_2");
    localStorage.removeItem("sela_vocab");
    location.reload();
  };
}

/* =========================================================
   开发者模式
   ========================================================= */
function devMode() {
  const params = new URLSearchParams(location.search);
  const dev = params.get("dev");
  if (!dev) return;

  const n = parseInt(params.get("n") || "0", 10);
  const msg = [];

  if (dev === "reset" || dev === "all") {
    localStorage.removeItem("sela_save");
    localStorage.removeItem("sela_save_2");
    localStorage.removeItem("sela_vocab");
    localStorage.removeItem("sela_name");
    msg.push("已清空所有存档");
  }

  if (dev === "second" || dev === "god" || dev === "all") {
    localStorage.setItem("sela_name", "开发者");
    msg.push("已进入二周目");
  }

  if (dev === "god") {
    const known = Object.keys(LEXICON);
    localStorage.setItem("sela_vocab", JSON.stringify(known));
    localStorage.setItem("sela_save_2", JSON.stringify({ level: 0, known }));
    msg.push("词典已填满（" + known.length + " 个词）");
  }

  if (dev === "stage") {
    localStorage.setItem("sela_save_2", JSON.stringify({ level: n, known: [] }));
    msg.push("跳到二周目第 " + n + " 关");
  }
  if (dev === "1stage") {
    localStorage.setItem("sela_save", JSON.stringify({ level: n, known: [] }));
    msg.push("跳到一周目第 " + n + " 关");
  }

  if (msg.length) {
    console.log("%c[DEV]", "color:#c8a24a;font-weight:bold;", msg.join(" / "));
  }
}

/* =========================================================
   启动
   ========================================================= */
devMode();
load();
render();
</script>
</body>
</html>
