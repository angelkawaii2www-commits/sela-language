<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遗语 · 反常频段</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #04070f;
    background-image:
      radial-gradient(ellipse at 50% -20%, #0a1838 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent, transparent 2px, #ffffff03 2px, #ffffff03 4px);
    color: #c8d4e0;
    font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
    padding: 24px 16px 60px;
    display: flex;
    justify-content: center;
  }

  .app { width: min(1180px, 100%); }

  /* ---------- header ---------- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 16px;
    border-bottom: 1px solid #122444;
    margin-bottom: 24px;
    gap: 16px;
    flex-wrap: wrap;
  }

  .brand {
    font-size: 20px;
    letter-spacing: 0.4em;
    color: #5a9ee8;
    text-shadow: 0 0 24px #5a9ee866;
  }

  .freq {
    font-family: "Courier New", monospace;
    font-size: 13px;
    letter-spacing: 0.2em;
    color: #4a5a75;
    flex: 1;
    text-align: center;
  }

  .freq .live {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: #5a9ee8;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
    animation: pulse 1.6s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.35; box-shadow: 0 0 0 #5a9ee800; }
    50% { opacity: 1; box-shadow: 0 0 12px #5a9ee8aa; }
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .progress {
    font-size: 12px;
    color: #7a8a9e;
    letter-spacing: 0.15em;
  }

  .btn-restart {
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.2em;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    background: transparent;
    border: 1px solid #1e3050;
    color: #7a8a9e;
    transition: all .18s;
  }

  .btn-restart:hover {
    border-color: #5a9ee8;
    color: #5a9ee8;
  }

  /* ---------- 布局 ---------- */
  .grid {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 18px;
    align-items: start;
  }

  @media (max-width: 880px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: linear-gradient(180deg, #08122a, #050a18);
    border: 1px solid #122444;
    border-radius: 10px;
    padding: 20px;
    min-height: 100px;
  }

  .panel h2 {
    font-size: 12px;
    letter-spacing: 0.3em;
    color: #6a7a95;
    font-weight: normal;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid #0e1c34;
  }

  .left-col {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ---------- 现场 ---------- */
  #clueTitle {
    font-size: 18px;
    color: #a8d0f0;
    margin-bottom: 12px;
    letter-spacing: 0.1em;
  }

  #clueText {
    font-size: 14px;
    line-height: 2;
    color: #8a9ab5;
    white-space: pre-line;
  }

  /* ---------- 频谱区 ---------- */
  .spectrum-controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }

  .audio-btn {
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.15em;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    background: transparent;
    border: 1px solid #2a4878;
    color: #8ab8e8;
    transition: all .18s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .audio-btn:hover {
    border-color: #5a9ee8;
    color: #a8d0f0;
    background: #0a1830;
  }

  .audio-btn.playing {
    border-color: #5a9ee8;
    color: #a8d0f0;
    background: #0a1830;
    box-shadow: 0 0 20px #5a9ee833;
  }

  .audio-btn .icon {
    font-size: 11px;
    opacity: 0.8;
  }

  .audio-btn.hint {
    border-color: #1e3050;
    color: #7a8a9e;
  }

  .audio-btn.hint:hover {
    border-color: #5a9ee8;
    color: #a8d0f0;
  }

  .audio-note {
    margin-top: -12px;
    margin-bottom: 20px;
    font-size: 12px;
    color: #5a6a85;
    letter-spacing: 0.1em;
    font-style: italic;
    padding-left: 4px;
  }

  /* ---------- 频谱块 ---------- */
  .spectrum {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 22px 16px;
    background: #030610;
    border: 1px solid #0e1c34;
    border-radius: 8px;
    margin-bottom: 6px;
    min-height: 130px;
    align-items: center;
    justify-content: center;
  }

  .spec-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #08122a;
    border: 1px solid #1a3050;
    border-radius: 8px;
    cursor: pointer;
    transition: all .22s;
    min-width: 90px;
  }

  .spec-block:hover {
    border-color: #5a9ee8;
    background: #0c1c3a;
    transform: translateY(-2px);
    box-shadow: 0 6px 24px #5a9ee822;
  }

  .spec-block.playing {
    border-color: #5a9ee8;
    box-shadow: 0 0 26px #5a9ee855;
  }

  .spec-wave {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 28px;
    padding: 0 4px;
  }

  .spec-wave span {
    display: block;
    width: 3px;
    background: #c8a24a;
    border-radius: 1px;
    opacity: 0.75;
  }

  .spec-block.root .spec-wave span {
    background: #c8a24a;
  }

  .spec-block.suffix .spec-wave span {
    background: #5ab8d8;
    opacity: 0.7;
  }

  .spec-text {
    font-family: "Courier New", monospace;
    font-size: 16px;
    letter-spacing: 0.15em;
    color: #e8c876;
    font-weight: bold;
  }

  .spec-block.suffix .spec-text {
    color: #7ac8e8;
    font-size: 15px;
  }

  .spec-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: #5a6a85;
    text-transform: uppercase;
  }

  .spec-block.root .spec-label { color: #c8a24a99; }
  .spec-block.suffix .spec-label { color: #5ab8d899; }

  /* ---------- 问题区 ---------- */
  .question-row {
    margin-top: 18px;
  }

  .question-label {
    font-size: 14px;
    color: #c8d4e0;
    margin-bottom: 12px;
    letter-spacing: 0.08em;
  }

  .input-row {
    display: flex;
    gap: 10px;
  }

  input[type="text"] {
    flex: 1;
    background: #04091a;
    border: 1px solid #1e3050;
    border-radius: 6px;
    padding: 12px 14px;
    color: #e8c876;
    font-family: inherit;
    font-size: 16px;
    outline: none;
    transition: border-color .2s;
    min-width: 0;
  }

  input[type="text"]:focus { border-color: #5a9ee8; }
  input[type="text"]::placeholder { color: #3a4a65; }

  .btn {
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.1em;
    padding: 12px 22px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all .18s;
    white-space: nowrap;
  }

  .btn.primary {
    background: #5a9ee8;
    color: #04091a;
    font-weight: bold;
  }

  .btn.primary:hover { background: #7ab8f8; }

  .feedback {
    min-height: 22px;
    margin-top: 12px;
    font-size: 14px;
    color: #e8a878;
    line-height: 1.7;
  }

  .feedback.good { color: #6fbf73; }

  /* ---------- 记录本 ---------- */
  .lex-section {
    margin-bottom: 24px;
  }

  .lex-section:last-child { margin-bottom: 0; }

  .lex-title {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: #7a8a9e;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #0e1c34;
  }

  .lex-title.root { color: #c8a24aaa; }
  .lex-title.suffix { color: #5ab8d8aa; }

  .lex-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .lex-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: #04091a;
    border-radius: 5px;
    border-left: 2px solid #c8a24a55;
    animation: fadeIn .4s;
  }

  .lex-item.suffix {
    border-left-color: #5ab8d855;
  }

  .lex-item .sela {
    font-family: "Courier New", monospace;
    font-size: 14px;
    letter-spacing: 0.12em;
    color: #e8c876;
    font-weight: bold;
  }

  .lex-item.suffix .sela {
    color: #7ac8e8;
    font-size: 13px;
  }

  .lex-item .cn {
    font-size: 13px;
    color: #8a9cb5;
  }

  .empty {
    color: #3a4a65;
    font-size: 13px;
    line-height: 1.7;
    font-style: italic;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- 弹层 ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: #000000e0;
    display: grid;
    place-items: center;
    padding: 24px;
    z-index: 99;
    animation: fadeIn .3s;
  }

  .reveal-box {
    max-width: 500px;
    background: linear-gradient(180deg, #0a1830, #050a18);
    border: 1px solid #5a9ee855;
    border-radius: 12px;
    padding: 34px 30px;
    text-align: center;
    box-shadow: 0 0 60px #5a9ee822;
  }

  .reveal-box p {
    font-size: 16px;
    line-height: 2;
    color: #c8d4e0;
    margin-bottom: 24px;
    white-space: pre-line;
  }

  .confirm-overlay {
    position: fixed;
    inset: 0;
    background: #000000e0;
    display: grid;
    place-items: center;
    padding: 24px;
    z-index: 100;
  }

  .confirm-box {
    max-width: 380px;
    background: linear-gradient(180deg, #0a1830, #050a18);
    border: 1px solid #5a9ee855;
    border-radius: 12px;
    padding: 30px 28px;
    text-align: center;
  }

  .confirm-box p {
    font-size: 15px;
    line-height: 1.9;
    color: #c8d4e0;
    margin-bottom: 24px;
  }

  .confirm-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .shake { animation: shake .35s; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .ending {
    max-width: 620px;
    margin: 100px auto;
    text-align: center;
    animation: fadeIn 1.2s;
  }

  .ending h1 {
    font-size: 26px;
    letter-spacing: 0.4em;
    color: #5a9ee8;
    margin-bottom: 44px;
  }

  .ending p {
    font-size: 15px;
    line-height: 2.2;
    color: #8a9cb5;
    margin-bottom: 12px;
  }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: #0a1830;
    border: 1px solid #2a4878;
    color: #8ab8e8;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 13px;
    letter-spacing: 0.1em;
    z-index: 200;
    animation: toastIn 2.4s forwards;
  }

  @keyframes toastIn {
    0% { opacity: 0; transform: translate(-50%, 10px); }
    15%, 85% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, 0); }
  }
  .inner-voice {
    min-height: 0;
    margin-bottom: 20px;
    padding: 0 4px;
    font-size: 14px;
    line-height: 1.9;
    font-style: italic;
    letter-spacing: 0.06em;
    color: #6a8ab0;
    opacity: 0;
    transition: opacity 1.2s ease-in;
    text-align: center;
  }

  .inner-voice.show {
    opacity: 1;
  }

  .inner-voice::before {
    content: "“";
    color: #4a6a95;
    margin-right: 2px;
  }

  .inner-voice::after {
    content: "”";
    color: #4a6a95;
    margin-left: 2px;
  }
  /* ---------- 对照关 ---------- */
#spectrum.compare-mode {
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  gap: 16px;
  padding: 18px 16px;
}

.known-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  padding: 10px 14px;
  background: #06102a;
  border: 1px solid #1a3050;
  border-radius: 8px;
  margin-bottom: 4px;
  align-items: center;
}

.known-label {
  font-size: 10px;
  letter-spacing: 0.3em;
  color: #5a6a85;
  padding-right: 10px;
  border-right: 1px solid #1a3050;
}

.known-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
}

.known-item .sela {
  font-family: "Courier New", monospace;
  font-size: 14px;
  letter-spacing: 0.1em;
  font-weight: bold;
}

.known-item.root .sela { color: #e8c876; }
.known-item.suffix .sela { color: #7ac8e8; }
.known-item .cn { color: #8a9cb5; }

.compare-row {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 10px 0;
  border-bottom: 1px dashed #122444;
  flex-wrap: wrap;
}

.compare-row:last-child { border-bottom: none; }

.compare-left {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  flex: 1;
  min-width: 200px;
}

.compare-left .spec-block {
  min-width: 60px;
  padding: 8px 10px;
  gap: 4px;
}

.compare-left .spec-block .spec-wave { height: 20px; }
.compare-left .spec-block .spec-wave span { width: 2px; }
.compare-left .spec-block .spec-text { font-size: 14px; }

.compare-right {
  flex: 0 0 auto;
  font-size: 14px;
  color: #c8d4e0;
  letter-spacing: 0.08em;
  padding-left: 12px;
  border-left: 2px solid #1a3050;
}

.compare-answers {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 14px;
}

.compare-answer-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.compare-answer-label {
  font-family: "Courier New", monospace;
  font-size: 16px;
  letter-spacing: 0.12em;
  color: #e8c876;
  font-weight: bold;
  flex: 0 0 60px;
}

.compare-answer-eq {
  color: #4a5a75;
  flex: 0 0 auto;
}

.compare-answer-input {
  flex: 1;
  background: #04091a;
  border: 1px solid #1e3050;
  border-radius: 6px;
  padding: 10px 14px;
  color: #e8c876;
  font-family: inherit;
  font-size: 15px;
  outline: none;
  min-width: 0;
  transition: border-color .2s;
}

.compare-answer-input:focus { border-color: #5a9ee8; }
.compare-answer-input::placeholder { color: #3a4a65; }
.compare-answer-input:disabled {
  background: #0a1830;
  color: #6fbf73;
  border-color: #2a4878;
  cursor: default;
}

.compare-answer-btn {
  flex: 0 0 auto;
  padding: 10px 16px;
  font-size: 13px;
}

.compare-answer-fb {
  flex: 0 0 auto;
  font-size: 12px;
  color: #e8a878;
  min-width: 40px;
}

.compare-answer-fb.good { color: #6fbf73; }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">反常频段</div>
    <div class="freq"><span class="live"></span>88.8 MHz · 信号捕捉中</div>
    <div class="header-right">
      <div class="progress" id="progress">第 1 关</div>
      <button class="btn-restart" id="restartBtn">重 开</button>
    </div>
  </header>

  <div class="grid">
    <div class="left-col">
      <section class="panel">
        <h2>现 场</h2>
        <div id="clueTitle"></div>
        <div id="clueText"></div>
      </section>

      <section class="panel">
        <h2>频 谱</h2>
        <div class="spectrum-controls" id="audioControls"></div>
        <div class="audio-note" id="audioNote"></div>
        <div class="inner-voice" id="innerVoice"></div>
        <div class="spectrum" id="spectrum"></div>
      </section>

      <section class="panel">
        <h2>解 读</h2>
        <div id="puzzle"></div>
      </section>
    </div>

    <aside class="panel">
      <h2>记 录 本</h2>
      <div class="lex-section">
        <div class="lex-title root">词 根 本</div>
        <div class="lex-list" id="rootList"></div>
      </div>
      <div class="lex-section">
        <div class="lex-title suffix">后 缀 本</div>
        <div class="lex-list" id="suffixList"></div>
      </div>
    </aside>
  </div>
</div>

<script>
/* =========================================================
   完整词典（初始为空，随关卡解锁）
   ========================================================= */
const ALL_ROOTS = {
  kal: "说 / 声音",
  vor: "看 / 注视",
  shen: "人",
  thok: "火",
  mel: "夜",
  zeth: "存在",
  mor: "死",
  dun: "给予",
  ith: "活"
};

const ALL_SUFFIXES = {
  esh: "主语",
  or: "宾语",
  um: "与格",
  tu: "过去",
  ka: "现在",
  vo: "将来",
  an: "否定",
  il: "疑问"
};

/* =========================================================
   状态
   ========================================================= */
const state = {
  level: 0,
  roots: [],      // 已学词根
  suffixes: [],   // 已学后缀
  levels: []      // 关卡表
};

const $ = s => document.querySelector(s);

/* =========================================================
   关卡数据
   ---------------------------------------------------------
   audios: 每个音频按钮
     - id:    标识（main / hint）
     - label: 按钮文字
     - file:  音频路径
     - note:  播放后显示的注释（可选）
   blocks: 频谱块
     - text:  显示的文本（如 kal）
     - type:  "root" | "suffix"
     - audio: 单独点击播放的音频
   ========================================================= */
const LEVELS = [
  {
    key: "K01",
    label: 1,
    title: "信号",
    scene: "凌晨两点十七分。你又失眠了。\n\n收音机开着，频率在 88.8 附近来回跳。忽然，一个声音从噪音里浮出来。\n\n很短。只有一个音节，重复了三次。",
    audios: [
      {
        id: "main",
        label: "▶ 播放信号",
        file: "audio/01-kal.mp3",
        note: "一个音节，重复了三次。"
      },
      {
        id: "hint",
        label: "▶ 再听一段",
        file: "audio/conversation.mp3",
        note: "之后你听到另一段声音。两个人，像是在交谈。但内容你听不懂。"
      }
    ],
    blocks: [
      { text: "kal", type: "root", audio: "audio/kal.mp3" }
    ],
    question: "这个声音在说什么？",
    accepts: ["说", "声音", "说话", "语言", "发声", "喊", "叫", "交流", "对话", "人声", "谈话", "言语"],
    learned: { type: "root", word: "kal", meaning: "说 / 声音" },
    reveal: "你回放了三遍。每一次，都是同一个词。\n\n它在说。或者，它就是「说」本身。",
    innerVoice: "将思想以声音的形式表达，就是这个词语。"
  },
{
  key: "K02",
  label: 2,
  kind: "compare",
  title: "影子",
  scene: "你调回那个频率。信号还在。\n\n这一次，声音没有停在原地。\n\nkal 后面，总是跟着另一个音节。很短，像是它的影子。\n\n但你发现，影子有两种。",
  audios: [
    {
      id: "esh",
      label: "▶ kal-esh",
      file: "audio/02-kal-esh.mp3",
      note: "一种尾巴。"
    },
    {
      id: "or",
      label: "▶ kal-or",
      file: "audio/02-kal-or.mp3",
      note: "另一种尾巴。听起来很短，方向却不一样。"
    },
    {
      id: "conversation",
      label: "▶ 再听一段",
      file: "audio/02-conversation.mp3",
      note: "又是那段对话。你听见 kal 后面跟着两种不同的尾巴。"
    }
  ],
  known: [
    { type: "root", text: "kal", cn: "说" }
  ],

state.levels = LEVELS;

/* =========================================================
   存档
   ========================================================= */
function save() {
  try {
    const lv = state.levels[state.level];
    localStorage.setItem("freq_save", JSON.stringify({
      level: state.level,
      key: lv ? lv.key : null,
      roots: state.roots,
      suffixes: state.suffixes
    }));
  } catch (e) {}
}

function load() {
  try {
    const raw = localStorage.getItem("freq_save");
    if (!raw) return;
    const d = JSON.parse(raw);
    if (Array.isArray(d.roots)) state.roots = d.roots;
    if (Array.isArray(d.suffixes)) state.suffixes = d.suffixes;
    if (typeof d.level === "number" && d.level >= 0 && d.level < state.levels.length) {
      state.level = d.level;
    }
    if (d.key) {
      const idx = state.levels.findIndex(l => l.key === d.key);
      if (idx >= 0) state.level = idx;
    }
  } catch (e) {}
}

/* =========================================================
   工具
   ========================================================= */
function norm(s) {
  return (s || "")
    .replace(/[\s，。！？、,.!?；;：:"'“”‘’（）()《》「」『』…—\-]/g, "")
    .toLowerCase();
}

/* 根据文本生成稳定波形 */
function generateBars(text, count) {
  let seed = 0;
  for (let i = 0; i < text.length; i++) seed += text.charCodeAt(i) * (i + 1);
  const bars = [];
  for (let i = 0; i < count; i++) {
    seed = (seed * 9301 + 49297) % 233280;
    const h = 6 + (seed / 233280) * 22;
    bars.push(Math.round(h));
  }
  return bars;
}

/* 播放音频（优雅降级） */
function playAudio(file, onStateChange) {
  let audio;
  try {
    audio = new Audio(file);
  } catch (e) {
    showToast("（音频无法播放）");
    if (onStateChange) onStateChange(false);
    return;
  }

  audio.onerror = () => {
    showToast("（此音频尚未录制）");
    if (onStateChange) onStateChange(false);
  };

  audio.onended = () => {
    if (onStateChange) onStateChange(false);
  };

  const p = audio.play();
  if (p && p.catch) {
    p.catch(() => {
      showToast("（此音频尚未录制）");
      if (onStateChange) onStateChange(false);
    });
  }

  if (onStateChange) onStateChange(true);
}

function showToast(text) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

/* =========================================================
   渲染主流程
   ========================================================= */
function render() {
  if (state.level >= state.levels.length) return renderEnding();
  const lv = state.levels[state.level];

  $("#progress").textContent = `第 ${lv.label} 关`;
  $("#clueTitle").textContent = lv.title;
  $("#clueText").textContent = lv.scene;

  renderLexicon();
  renderAudio(lv);

  if (lv.kind === "compare") {
    renderCompare(lv);
  } else {
    renderBlocks(lv);
    renderPuzzle(lv);
  }
}

/* ---------- 记录本 ---------- */
function renderLexicon() {
  const rootBox = $("#rootList");
  const suffixBox = $("#suffixList");

  if (state.roots.length === 0) {
    rootBox.innerHTML = `<div class="empty">尚未记录任何词根。</div>`;
  } else {
    rootBox.innerHTML = state.roots.map(w => `
      <div class="lex-item">
        <span class="sela">${w}</span>
        <span class="cn">${ALL_ROOTS[w] || "?"}</span>
      </div>
    `).join("");
  }

  if (state.suffixes.length === 0) {
    suffixBox.innerHTML = `<div class="empty">尚未记录任何后缀。</div>`;
  } else {
    suffixBox.innerHTML = state.suffixes.map(w => `
      <div class="lex-item suffix">
        <span class="sela">-${w}</span>
        <span class="cn">${ALL_SUFFIXES[w] || "?"}</span>
      </div>
    `).join("");
  }
}

/* ---------- 音频按钮 ---------- */
function renderAudio(lv) {
  const controls = $("#audioControls");
  const note = $("#audioNote");
  controls.innerHTML = "";
  note.textContent = "";

  if (!lv.audios || !lv.audios.length) return;

  lv.audios.forEach((a, i) => {
    const btn = document.createElement("button");
    btn.className = "audio-btn" + (i > 0 ? " hint" : "");
    btn.innerHTML = `<span class="icon">●</span>${a.label}`;

  btn.onclick = () => {
    document.querySelectorAll(".audio-btn").forEach(b => b.classList.remove("playing"));
    btn.classList.add("playing");

  // 每次点击都先隐藏内心独白
    const iv = $("#innerVoice");
    if (iv) {
      iv.classList.remove("show");
      iv.textContent = "";
    }

    playAudio(a.file, (playing) => {
      if (!playing) {
        btn.classList.remove("playing");

      // 主音频结束后，延迟显示内心独白
        if (a.id === "main" && lv.innerVoice) {
          setTimeout(() => {
            const iv2 = $("#innerVoice");
            if (iv2) {
              iv2.textContent = lv.innerVoice;
              iv2.classList.add("show");
            }
          }, 1200);
        }
      }
    });

    if (a.note) note.textContent = a.note;
  };

    controls.appendChild(btn);
  });
}

/* ---------- 频谱块 ---------- */
function renderBlocks(lv) {
  const box = $("#spectrum");
  box.innerHTML = "";
  box.classList.remove("compare-mode");

  if (!lv.blocks || !lv.blocks.length) return;

  lv.blocks.forEach(block => {
    const el = document.createElement("div");
    el.className = "spec-block " + (block.type || "root");

    const bars = generateBars(block.text, 14);
    const waveHTML = bars.map(h => `<span style="height:${h}px"></span>`).join("");

    el.innerHTML = `
      <div class="spec-wave">${waveHTML}</div>
      <div class="spec-text">${block.text}</div>
      <div class="spec-label">${block.type === "suffix" ? "后缀" : "词根"}</div>
    `;

    el.onclick = () => {
      if (!block.audio) return;
      document.querySelectorAll(".spec-block").forEach(b => b.classList.remove("playing"));
      el.classList.add("playing");
      playAudio(block.audio, (playing) => {
        if (!playing) el.classList.remove("playing");
      });
    };

    box.appendChild(el);
  });
}

/* ---------- 问题区 ---------- */
function renderPuzzle(lv) {
  const p = $("#puzzle");

  p.innerHTML = `
    <div class="question-row">
      <div class="question-label">${lv.question}</div>
      <div class="input-row">
        <input type="text" id="answer" placeholder="输入你的解读…" autocomplete="off" spellcheck="false">
        <button class="btn primary" id="submit">提交</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  `;

  const input = $("#answer");
  const submit = () => {
    const v = norm(input.value);
    if (!v) return;
    if (lv.accepts.some(a => norm(a) === v)) {
      $("#feedback").className = "feedback good";
      $("#feedback").textContent = "正确。";
      setTimeout(() => finishLevel(lv), 400);
    } else {
      $("#feedback").className = "feedback";
      $("#feedback").textContent = "不对。再听一次，或者看看频谱。";
      input.classList.add("shake");
      setTimeout(() => input.classList.remove("shake"), 400);
    }
  };

  $("#submit").onclick = submit;
  input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  input.focus();
}
/* ---------- 对照关 ---------- */
function renderCompare(lv) {
  // 频谱区
  const spec = $("#spectrum");
  spec.innerHTML = "";
  spec.classList.add("compare-mode");

  // 已知词栏
  if (lv.known && lv.known.length) {
    const knownBox = document.createElement("div");
    knownBox.className = "known-bar";
    knownBox.innerHTML = `<span class="known-label">已 知</span>` +
      lv.known.map(k => {
        const cls = k.type === "suffix" ? "suffix" : "root";
        const text = k.type === "suffix" ? "-" + k.text.replace(/^-/, "") : k.text;
        return `<span class="known-item ${cls}"><span class="sela">${text}</span><span class="cn">${k.cn}</span></span>`;
      }).join("");
    spec.appendChild(knownBox);
  }

  // 三组对照
  lv.pairs.forEach(pair => {
    const row = document.createElement("div");
    row.className = "compare-row";

    const left = document.createElement("div");
    left.className = "compare-left";

    pair.devil.forEach(b => {
      const block = document.createElement("div");
      block.className = "spec-block " + (b.type || "root");
      const bars = generateBars(b.text, 12);
      const waveHTML = bars.map(h => `<span style="height:${h}px"></span>`).join("");
      block.innerHTML = `
        <div class="spec-wave">${waveHTML}</div>
        <div class="spec-text">${b.text}</div>
      `;
      block.onclick = () => {
        if (!b.audio) return;
        document.querySelectorAll(".spec-block").forEach(x => x.classList.remove("playing"));
        block.classList.add("playing");
        playAudio(b.audio, (playing) => { if (!playing) block.classList.remove("playing"); });
      };
      left.appendChild(block);
    });

    const right = document.createElement("div");
    right.className = "compare-right";
    right.textContent = pair.cn;

    row.appendChild(left);
    row.appendChild(right);
    spec.appendChild(row);
  });

  // 问题区
  const p = $("#puzzle");
  p.innerHTML = `
    <div class="question-row">
      <div class="question-label">${lv.question}</div>
      <div class="compare-answers" id="compareAnswers"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  `;

  const container = $("#compareAnswers");
  const done = lv.answers.map(() => false);

  lv.answers.forEach((item, i) => {
    const row = document.createElement("div");
    row.className = "compare-answer-row";

    const label = document.createElement("span");
    label.className = "compare-answer-label";
    label.textContent = item.word;
    row.appendChild(label);

    const eq = document.createElement("span");
    eq.className = "compare-answer-eq";
    eq.textContent = "=";
    row.appendChild(eq);

    const input = document.createElement("input");
    input.type = "text";
    input.className = "compare-answer-input";
    input.placeholder = "输入含义…";
    input.autocomplete = "off";
    input.spellcheck = false;
    row.appendChild(input);

    const btn = document.createElement("button");
    btn.className = "btn primary compare-answer-btn";
    btn.textContent = "确认";
    row.appendChild(btn);

    const fb = document.createElement("span");
    fb.className = "compare-answer-fb";
    row.appendChild(fb);

    const check = () => {
      if (done[i]) return;
      const v = norm(input.value);
      if (!v) return;
      if (item.accepts.some(a => norm(a) === v)) {
        done[i] = true;
        input.value = item.meaning;
        input.disabled = true;
        btn.disabled = true;
        btn.textContent = "✓";
        fb.className = "compare-answer-fb good";
        fb.textContent = "✓";
        if (done.every(Boolean)) {
          $("#feedback").className = "feedback good";
          $("#feedback").textContent = "全部正确。";
          setTimeout(() => finishLevel(lv), 700);
        }
      } else {
        fb.className = "compare-answer-fb";
        fb.textContent = "不对";
        input.classList.add("shake");
        setTimeout(() => input.classList.remove("shake"), 400);
      }
    };

    btn.onclick = check;
    input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });

    container.appendChild(row);
  });

  const first = container.querySelector("input:not([disabled])");
  if (first) first.focus();
}

/* =========================================================
   过关
   ========================================================= */
function finishLevel(lv) {
  if (lv.learned) {
    const items = Array.isArray(lv.learned) ? lv.learned : [lv.learned];
    items.forEach(item => {
      if (item.type === "root" && !state.roots.includes(item.word)) {
        state.roots.push(item.word);
      }
      if (item.type === "suffix" && !state.suffixes.includes(item.word)) {
        state.suffixes.push(item.word);
      }
    });
  }

  state.level++;
  save();
  
  showReveal(lv.reveal || "信号中断。", () => {
    if (state.level >= state.levels.length) renderEnding();
    else render();
  });
}

function showReveal(text, cb) {
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="reveal-box">
      <p>${text}</p>
      <button class="btn primary">继续</button>
    </div>
  `;
  overlay.querySelector("button").onclick = () => {
    overlay.remove();
    cb();
  };
  document.body.appendChild(overlay);
}

/* =========================================================
   结束（暂时占位）
   ========================================================= */
function renderEnding() {
  const app = document.querySelector(".app");
  app.innerHTML = `
    <div class="ending">
      <h1>信 号 中 断</h1>
      <p>你听完了这一段。</p>
      <p>频道重新归于噪音。</p>
      <p style="margin-top:40px;font-size:13px;color:#6d5545;">（后续关卡待添加）</p>
      <button class="btn primary" id="endRestart" style="margin-top:40px;">重新开始</button>
    </div>
  `;
  $("#endRestart").onclick = () => {
    localStorage.removeItem("freq_save");
    location.reload();
  };
}

/* =========================================================
   重开
   ========================================================= */
function restartGame() {
  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  overlay.innerHTML = `
    <div class="confirm-box">
      <p>确定要重新开始吗？<br>当前的进度会被清空。</p>
      <div class="confirm-actions">
        <button class="btn" id="cancelRestart" style="background:transparent;border:1px solid #3a2020;color:#8a7f6e;">取消</button>
        <button class="btn primary" id="confirmRestart">重开</button>
      </div>
    </div>
  `;
  overlay.querySelector("#cancelRestart").onclick = () => overlay.remove();
  overlay.querySelector("#confirmRestart").onclick = () => {
    localStorage.removeItem("freq_save");
    location.reload();
  };
  document.body.appendChild(overlay);
}

document.addEventListener("click", e => {
  if (e.target && e.target.id === "restartBtn") restartGame();
});

/* =========================================================
   开发者模式
   ---------------------------------------------------------
   ?dev=reset      清空存档
   ?dev=stage&n=2  跳到第 2 关（按索引，0 起算）
   ========================================================= */
function devMode() {
  const params = new URLSearchParams(location.search);
  const dev = params.get("dev");
  if (!dev) return;

  if (dev === "reset") {
    localStorage.removeItem("freq_save");
    console.log("%c[DEV]", "color:#c84444;font-weight:bold;", "存档已清空");
  }
  if (dev === "stage") {
    const n = parseInt(params.get("n") || "0", 10);
    try {
      localStorage.setItem("freq_save", JSON.stringify({
        level: n,
        roots: [],
        suffixes: []
      }));
      console.log("%c[DEV]", "color:#c84444;font-weight:bold;", "跳到第 " + n + " 关");
    } catch (e) {}
  }
}

/* =========================================================
   启动
   ========================================================= */
devMode();
load();
render();
