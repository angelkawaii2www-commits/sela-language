<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遗语 · 反常频段</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #04070f;
    background-image:
      radial-gradient(ellipse at 50% -20%, #0a1838 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent, transparent 2px, #ffffff03 2px, #ffffff03 4px);
    color: #c8d4e0;
    font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
    padding: 24px 16px 60px;
    display: flex;
    justify-content: center;
  }

  .app { width: min(1180px, 100%); }

  /* ---------- header ---------- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 16px;
    border-bottom: 1px solid #122444;
    margin-bottom: 24px;
    gap: 16px;
    flex-wrap: wrap;
  }

  .brand {
    font-size: 20px;
    letter-spacing: 0.4em;
    color: #5a9ee8;
    text-shadow: 0 0 24px #5a9ee866;
  }

  .freq {
    font-family: "Courier New", monospace;
    font-size: 13px;
    letter-spacing: 0.2em;
    color: #4a5a75;
    flex: 1;
    text-align: center;
  }

  .freq .live {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: #5a9ee8;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
    animation: pulse 1.6s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.35; box-shadow: 0 0 0 #5a9ee800; }
    50% { opacity: 1; box-shadow: 0 0 12px #5a9ee8aa; }
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .progress {
    font-size: 12px;
    color: #7a8a9e;
    letter-spacing: 0.15em;
  }

  .btn-restart {
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.2em;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    background: transparent;
    border: 1px solid #1e3050;
    color: #7a8a9e;
    transition: all .18s;
  }

  .btn-restart:hover {
    border-color: #5a9ee8;
    color: #5a9ee8;
  }

  /* ---------- 布局 ---------- */
  .grid {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 18px;
    align-items: start;
  }

  @media (max-width: 880px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: linear-gradient(180deg, #08122a, #050a18);
    border: 1px solid #122444;
    border-radius: 10px;
    padding: 20px;
    min-height: 100px;
  }

  .panel h2 {
    font-size: 12px;
    letter-spacing: 0.3em;
    color: #6a7a95;
    font-weight: normal;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid #0e1c34;
  }

  .left-col {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ---------- 现场 ---------- */
  #clueTitle {
    font-size: 18px;
    color: #a8d0f0;
    margin-bottom: 12px;
    letter-spacing: 0.1em;
  }

  #clueText {
    font-size: 14px;
    line-height: 2;
    color: #8a9ab5;
    white-space: pre-line;
  }

  /* ---------- 频谱区 ---------- */
  .spectrum-controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }

  .audio-btn {
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.15em;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    background: transparent;
    border: 1px solid #2a4878;
    color: #8ab8e8;
    transition: all .18s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .audio-btn:hover {
    border-color: #5a9ee8;
    color: #a8d0f0;
    background: #0a1830;
  }

  .audio-btn.playing {
    border-color: #5a9ee8;
    color: #a8d0f0;
    background: #0a1830;
    box-shadow: 0 0 20px #5a9ee833;
  }

  .audio-btn .icon {
    font-size: 11px;
    opacity: 0.8;
  }

  .audio-btn.hint {
    border-color: #1e3050;
    color: #7a8a9e;
  }

  .audio-btn.hint:hover {
    border-color: #5a9ee8;
    color: #a8d0f0;
  }

  .audio-note {
    margin-top: -12px;
    margin-bottom: 20px;
    font-size: 12px;
    color: #5a6a85;
    letter-spacing: 0.1em;
    font-style: italic;
    padding-left: 4px;
  }

  /* ---------- 频谱块 ---------- */
  .spectrum {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 22px 16px;
    background: #030610;
    border: 1px solid #0e1c34;
    border-radius: 8px;
    margin-bottom: 6px;
    min-height: 130px;
    align-items: center;
    justify-content: center;
  }

  .spec-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #08122a;
    border: 1px solid #1a3050;
    border-radius: 8px;
    cursor: pointer;
    transition: all .22s;
    min-width: 90px;
  }

  .spec-block:hover {
    border-color: #5a9ee8;
    background: #0c1c3a;
    transform: translateY(-2px);
    box-shadow: 0 6px 24px #5a9ee822;
  }

  .spec-block.playing {
    border-color: #5a9ee8;
    box-shadow: 0 0 26px #5a9ee855;
  }

  .spec-wave {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 28px;
    padding: 0 4px;
  }

  .spec-wave span {
    display: block;
    width: 3px;
    background: #c8a24a;
    border-radius: 1px;
    opacity: 0.75;
  }

  .spec-block.root .spec-wave span {
    background: #c8a24a;
  }

  .spec-block.suffix .spec-wave span {
    background: #5ab8d8;
    opacity: 0.7;
  }

  .spec-text {
    font-family: "Courier New", monospace;
    font-size: 16px;
    letter-spacing: 0.15em;
    color: #e8c876;
    font-weight: bold;
  }

  .spec-block.suffix .spec-text {
    color: #7ac8e8;
    font-size: 15px;
  }

  .spec-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: #5a6a85;
    text-transform: uppercase;
  }

  .spec-block.root .spec-label { color: #c8a24a99; }
  .spec-block.suffix .spec-label { color: #5ab8d899; }

  /* ---------- 问题区 ---------- */
  .question-row {
    margin-top: 18px;
  }

  .question-label {
    font-size: 14px;
    color: #c8d4e0;
    margin-bottom: 12px;
    letter-spacing: 0.08em;
  }

  .input-row {
    display: flex;
    gap: 10px;
  }

  input[type="text"] {
    flex: 1;
    background: #04091a;
    border: 1px solid #1e3050;
    border-radius: 6px;
    padding: 12px 14px;
    color: #e8c876;
    font-family: inherit;
    font-size: 16px;
    outline: none;
    transition: border-color .2s;
    min-width: 0;
  }

  input[type="text"]:focus { border-color: #5a9ee8; }
  input[type="text"]::placeholder { color: #3a4a65; }

  .btn {
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.1em;
    padding: 12px 22px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all .18s;
    white-space: nowrap;
  }

  .btn.primary {
    background: #5a9ee8;
    color: #04091a;
    font-weight: bold;
  }

  .btn.primary:hover { background: #7ab8f8; }

  .feedback {
    min-height: 22px;
    margin-top: 12px;
    font-size: 14px;
    color: #e8a878;
    line-height: 1.7;
  }

  .feedback.good { color: #6fbf73; }

  /* ---------- 记录本 ---------- */
  .lex-section {
    margin-bottom: 24px;
  }

  .lex-section:last-child { margin-bottom: 0; }

  .lex-title {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: #7a8a9e;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #0e1c34;
  }

  .lex-title.root { color: #c8a24aaa; }
  .lex-title.suffix { color: #5ab8d8aa; }

  .lex-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .lex-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: #04091a;
    border-radius: 5px;
    border-left: 2px solid #c8a24a55;
    animation: fadeIn .4s;
  }

  .lex-item.suffix {
    border-left-color: #5ab8d855;
  }

  .lex-item .sela {
    font-family: "Courier New", monospace;
    font-size: 14px;
    letter-spacing: 0.12em;
    color: #e8c876;
    font-weight: bold;
  }

  .lex-item.suffix .sela {
    color: #7ac8e8;
    font-size: 13px;
  }

  .lex-item .cn {
    font-size: 13px;
    color: #8a9cb5;
  }

  .empty {
    color: #3a4a65;
    font-size: 13px;
    line-height: 1.7;
    font-style: italic;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- 弹层 ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: #000000e0;
    display: grid;
    place-items: center;
    padding: 24px;
    z-index: 99;
    animation: fadeIn .3s;
  }

  .reveal-box {
    max-width: 500px;
    background: linear-gradient(180deg, #0a1830, #050a18);
    border: 1px solid #5a9ee855;
    border-radius: 12px;
    padding: 34px 30px;
    text-align: center;
    box-shadow: 0 0 60px #5a9ee822;
  }

  .reveal-box p {
    font-size: 16px;
    line-height: 2;
    color: #c8d4e0;
    margin-bottom: 24px;
    white-space: pre-line;
  }

  .confirm-overlay {
    position: fixed;
    inset: 0;
    background: #000000e0;
    display: grid;
    place-items: center;
    padding: 24px;
    z-index: 100;
  }

  .confirm-box {
    max-width: 380px;
    background: linear-gradient(180deg, #0a1830, #050a18);
    border: 1px solid #5a9ee855;
    border-radius: 12px;
    padding: 30px 28px;
    text-align: center;
  }

  .confirm-box p {
    font-size: 15px;
    line-height: 1.9;
    color: #c8d4e0;
    margin-bottom: 24px;
  }

  .confirm-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .shake { animation: shake .35s; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .ending {
    max-width: 620px;
    margin: 100px auto;
    text-align: center;
    animation: fadeIn 1.2s;
  }

  .ending h1 {
    font-size: 26px;
    letter-spacing: 0.4em;
    color: #5a9ee8;
    margin-bottom: 44px;
  }

  .ending p {
    font-size: 15px;
    line-height: 2.2;
    color: #8a9cb5;
    margin-bottom: 12px;
  }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: #0a1830;
    border: 1px solid #2a4878;
    color: #8ab8e8;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 13px;
    letter-spacing: 0.1em;
    z-index: 200;
    animation: toastIn 2.4s forwards;
  }

  @keyframes toastIn {
    0% { opacity: 0; transform: translate(-50%, 10px); }
    15%, 85% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, 0); }
  }
  .inner-voice {
    min-height: 0;
    margin-bottom: 20px;
    padding: 0 4px;
    font-size: 14px;
    line-height: 1.9;
    font-style: italic;
    letter-spacing: 0.06em;
    color: #6a8ab0;
    opacity: 0;
    transition: opacity 1.2s ease-in;
    text-align: center;
  }

  .inner-voice.show {
    opacity: 1;
  }

  .inner-voice::before {
    content: "“";
    color: #4a6a95;
    margin-right: 2px;
  }

  .inner-voice::after {
    content: "”";
    color: #4a6a95;
    margin-left: 2px;
  }
  /* ---------- 对照关 ---------- */
#spectrum.compare-mode {
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  gap: 16px;
  padding: 18px 16px;
}

.known-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  padding: 10px 14px;
  background: #06102a;
  border: 1px solid #1a3050;
  border-radius: 8px;
  margin-bottom: 4px;
  align-items: center;
}

.known-label {
  font-size: 10px;
  letter-spacing: 0.3em;
  color: #5a6a85;
  padding-right: 10px;
  border-right: 1px solid #1a3050;
}

.known-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
}

.known-item .sela {
  font-family: "Courier New", monospace;
  font-size: 14px;
  letter-spacing: 0.1em;
  font-weight: bold;
}

.known-item.root .sela { color: #e8c876; }
.known-item.suffix .sela { color: #7ac8e8; }
.known-item .cn { color: #8a9cb5; }

.compare-row {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 10px 0;
  border-bottom: 1px dashed #122444;
  flex-wrap: wrap;
}

.compare-row:last-child { border-bottom: none; }

.compare-left {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  flex: 1;
  min-width: 200px;
}

.compare-left .spec-block {
  min-width: 60px;
  padding: 8px 10px;
  gap: 4px;
}

.compare-left .spec-block .spec-wave { height: 20px; }
.compare-left .spec-block .spec-wave span { width: 2px; }
.compare-left .spec-block .spec-text { font-size: 14px; }

.compare-right {
  flex: 0 0 auto;
  font-size: 14px;
  color: #c8d4e0;
  letter-spacing: 0.08em;
  padding-left: 12px;
  border-left: 2px solid #1a3050;
}

.compare-answers {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 14px;
}

.compare-answer-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.compare-answer-label {
  font-family: "Courier New", monospace;
  font-size: 16px;
  letter-spacing: 0.12em;
  color: #e8c876;
  font-weight: bold;
  flex: 0 0 60px;
}

.compare-answer-eq {
  color: #4a5a75;
  flex: 0 0 auto;
}

.compare-answer-input {
  flex: 1;
  background: #04091a;
  border: 1px solid #1e3050;
  border-radius: 6px;
  padding: 10px 14px;
  color: #e8c876;
  font-family: inherit;
  font-size: 15px;
  outline: none;
  min-width: 0;
  transition: border-color .2s;
}

.compare-answer-input:focus { border-color: #5a9ee8; }
.compare-answer-input::placeholder { color: #3a4a65; }
.compare-answer-input:disabled {
  background: #0a1830;
  color: #6fbf73;
  border-color: #2a4878;
  cursor: default;
}

.compare-answer-btn {
  flex: 0 0 auto;
  padding: 10px 16px;
  font-size: 13px;
}

.compare-answer-fb {
  flex: 0 0 auto;
  font-size: 12px;
  color: #e8a878;
  min-width: 40px;
}

.compare-answer-fb.good { color: #6fbf73; }
/* ---------- 通讯关 ---------- */
.freq-display {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 12px;
  padding: 32px 0;
  margin: 20px 0;
  background: #04091a;
  border: 1px solid #1e3050;
  border-radius: 8px;
  animation: freqGlow 2.4s infinite;
}

.freq-value {
  font-family: "Courier New", monospace;
  font-size: 56px;
  letter-spacing: 0.08em;
  color: #5a9ee8;
  font-weight: bold;
  text-shadow: 0 0 40px #5a9ee866;
}

.freq-unit {
  font-family: "Courier New", monospace;
  font-size: 18px;
  letter-spacing: 0.3em;
  color: #4a6898;
}

@keyframes freqGlow {
  0%, 100% { box-shadow: 0 0 0 transparent; }
  50% { box-shadow: 0 0 30px #5a9ee822 inset; }
}

.caller-line {
  font-family: "Courier New", monospace;
  font-size: 24px;
  letter-spacing: 0.2em;
  color: #a8d0f0;
  font-weight: bold;
  margin-bottom: 6px;
}

.caller-cn {
  font-size: 14px;
  color: #8a9cb5;
  letter-spacing: 0.1em;
}

/* ---------- 敌人彩蛋 ---------- */
.enemy-overlay {
  position: fixed;
  inset: 0;
  background: #400000;
  z-index: 999;
  overflow: hidden;
  animation: enemyFlash 0.2s infinite alternate;
}

.enemy-overlay.fade-out {
  opacity: 0;
  transition: opacity 0.5s;
}

.enemy-overlay span {
  position: absolute;
  color: #ff2020;
  font-family: "SimHei", "Microsoft YaHei", sans-serif;
  font-weight: bold;
  text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
  letter-spacing: 0.05em;
  white-space: nowrap;
}

@keyframes enemyFlash {
  from { background: #400000; }
  to { background: #700000; }
}
/* ---------- 时间轴关 ---------- */
.timeline-nav {
  display: flex;
  gap: 12px;
  justify-content: center;
  padding: 18px 0 22px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}

.timeline-btn {
  font-family: inherit;
  font-size: 14px;
  letter-spacing: 0.15em;
  padding: 12px 28px;
  border-radius: 6px;
  cursor: pointer;
  background: transparent;
  border: 1px solid #1e3050;
  color: #7a8a9e;
  transition: all .3s;
  min-width: 110px;
}

.timeline-btn:hover {
  border-color: #5a9ee8;
  color: #a8d0f0;
}

.timeline-btn.active {
  border-color: #5a9ee8;
  color: #a8d0f0;
  background: #0a1830;
  box-shadow: 0 0 24px #5a9ee833;
}

.timeline-sentence {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 22px 16px;
  background: #030610;
  border: 1px solid #0e1c34;
  border-radius: 8px;
  justify-content: center;
  align-items: center;
  min-height: 110px;
  margin-bottom: 14px;
  transition: opacity .3s;
}

.timeline-sentence.fading {
  opacity: 0;
}

.timeline-sentence .spec-block {
  min-width: 70px;
  padding: 10px 12px;
}

.timeline-audio-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.timeline-audio-row .audio-btn {
  font-size: 12px;
  padding: 8px 16px;
}

/* ---------- 血红色遮罩 ---------- */
.blood-overlay {
  position: fixed;
  inset: 0;
  background: #8b0000;
  z-index: 999;
  pointer-events: none;
  animation: bloodPulse 0.15s infinite alternate;
}

.blood-overlay.fade-out {
  opacity: 0;
  transition: opacity 0.5s;
}

@keyframes bloodPulse {
  from { background: #8b0000; }
  to { background: #cc0000; }
}

.caller-cn.highlight {
  color: #e8a878;
  font-weight: bold;
  text-shadow: 0 0 12px #e8a87855;
}

/* ---------- 广播关 ---------- */
.broadcast-progress {
  text-align: center;
  font-family: "Courier New", monospace;
  font-size: 12px;
  color: #5a6a85;
  letter-spacing: 0.15em;
  margin-bottom: 14px;
  padding-bottom: 14px;
  border-bottom: 1px solid #0e1c34;
}

.broadcast-progress .done {
  color: #6fbf73;
}

.broadcast-row {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 10px 0;
  border-bottom: 1px dashed #0e1c34;
}

.broadcast-row:last-child { border-bottom: none; }

.broadcast-num {
  font-family: "Courier New", monospace;
  font-size: 11px;
  color: #4a5a75;
  letter-spacing: 0.05em;
  min-width: 28px;
  flex: 0 0 auto;
  padding-top: 10px;
}

.broadcast-row .compare-left {
  min-width: 0;
}

.broadcast-answer-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px dashed #0e1c34;
}

.broadcast-answer-row:last-child { border-bottom: none; }

.broadcast-answer-num {
  font-family: "Courier New", monospace;
  font-size: 11px;
  color: #4a5a75;
  letter-spacing: 0.05em;
  min-width: 28px;

/* ---------- 回话关 ---------- */

  border-bottom: 1px solid #0e1c34;
}

.reply-option:hover .reply-option-label {

}

.reply-option-text {

  font-size: 15px;

}

.reply-option-cn {

}

.reply-option.correct {

.reply-feedback {

}

.reply-feedback.warn { color: #e8a878; }

/* ---------- 隐藏分支占位 ---------- */

/* ---------- 对话关 ---------- */

}

.dialogue-label {

}

.dialogue-text {

.dialogue-text .dc {

/* ---------- 疯 彩蛋 ---------- */
.cyull-overlay {
  position: fixed;
  inset: 0;
  background: #000000e6;
  display: grid;
  place-items: center;
  padding: 24px;
  z-index: 999;
  animation: fadeIn 0.6s;
}

.cyull-box {
  max-width: 500px;
  text-align: center;
}

.cyull-word {
  font-family: "Courier New", monospace;
  font-size: 72px;
  letter-spacing: 0.15em;

  text-shadow: 0 0 60px #e8a87866, 0 0 120px #e8a87833;
  margin-bottom: 30px;
  animation: cyullShake 0.6s;
}

@keyframes cyullShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

.cyull-cn {
  font-size: 18px;
  color: #c8d4e0;
  letter-spacing: 0.4em;
  margin-bottom: 20px;
}

.cyull-sub {
  font-size: 13px;
  color: #6a7a95;
  letter-spacing: 0.15em;
  font-style: italic;
}

/* ---------- 笔记按钮 ---------- */

  font-family: inherit;
  font-size: 12px;
  letter-spacing: 0.2em;

}

.notes-panel {

}

  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

  line-height: 2.4;

state.levels = LEVELS;

/* =========================================================
   存档
   ========================================================= */
function save() {
  try {
    const lv = state.levels[state.level];
    localStorage.setItem("freq_save", JSON.stringify({
      level: state.level,
      key: lv ? lv.key : null,
      roots: state.roots,
      suffixes: state.suffixes
    }));
  } catch (e) {}
}

function load() {
  try {
    const raw = localStorage.getItem("freq_save");
    if (!raw) return;
    const d = JSON.parse(raw);
    if (Array.isArray(d.roots)) state.roots = d.roots;
    if (Array.isArray(d.suffixes)) state.suffixes = d.suffixes;
    if (typeof d.level === "number" && d.level >= 0 && d.level < state.levels.length) {
      state.level = d.level;
    }
    if (d.key) {
      const idx = state.levels.findIndex(l => l.key === d.key);
      if (idx >= 0) state.level = idx;
    }
  } catch (e) {}
}

/* =========================================================
   工具
   ========================================================= */
function norm(s) {
  return (s || "")
    .replace(/[\s，。！？、,.!?；;：:"'“”‘’（）()《》「」『』…—\-]/g, "")
    .toLowerCase();
}

/* 根据文本生成稳定波形 */
function generateBars(text, count) {
  let seed = 0;
  for (let i = 0; i < text.length; i++) seed += text.charCodeAt(i) * (i + 1);
  const bars = [];
  for (let i = 0; i < count; i++) {
    seed = (seed * 9301 + 49297) % 233280;
    const h = 6 + (seed / 233280) * 22;
    bars.push(Math.round(h));
  }
  return bars;
}

/* 播放音频（优雅降级） */
function playAudio(file, onStateChange) {
  let audio;
  try {
    audio = new Audio(file);
  } catch (e) {
    showToast("（音频无法播放）");
    if (onStateChange) onStateChange(false);
    return;
  }

  audio.onerror = () => {
    showToast("（此音频尚未录制）");
    if (onStateChange) onStateChange(false);
  };

  audio.onended = () => {
    if (onStateChange) onStateChange(false);
  };

  const p = audio.play();
  if (p && p.catch) {
    p.catch(() => {
      showToast("（此音频尚未录制）");
      if (onStateChange) onStateChange(false);
    });
  }

  if (onStateChange) onStateChange(true);
}

function showToast(text) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

/* =========================================================
   渲染主流程
   ========================================================= */
function render() {
  if (state.level >= state.levels.length) return renderEnding();
  const lv = state.levels[state.level];

  // 通讯关进入新关卡时重置阶段
  if (state.lastCommKey !== lv.key) {
    state.lastCommKey = lv.key;
    state.commStage = 1;
  }

  $("#progress").textContent = `第 ${lv.label} 关`;
  $("#clueTitle").textContent = lv.title;
  $("#clueText").textContent = lv.scene;

// 频率显示：随剧情推进切换
  const freqEl = $("#freqDisplay");
  if (freqEl) {
    if (state.level >= 10) {
      freqEl.innerHTML = '<span class="live"></span>66.6 MHz · 信号锁定中';
    } else if (state.level >= 5) {
      freqEl.innerHTML = '<span class="live"></span>77.7 MHz · 信号重连中';
    } else {
      freqEl.innerHTML = '<span class="live"></span>88.8 MHz · 信号捕捉中';
    }
  }

  renderLexicon();
  renderAudio(lv);

  if (lv.kind === "compare") {
    renderCompare(lv);
  } else if (lv.kind === "comm") {
    renderComm(lv);
  } else if (lv.kind === "timeline") {
    renderTimeline(lv);
  } else if (lv.kind === "broadcast") {
    renderBroadcast(lv);
  } else if (lv.kind === "reply") {
    renderReply(lv);
  } else if (lv.kind === "dialogue") {
    renderDialogue(lv);
  } else if (lv.kind === "essay") {
    renderEssay(lv);
  } else if (lv.kind === "temptation") {
    renderTemptation(lv);
  } else if (lv.kind === "finale") {
    renderFinale(lv);
  } else {
    renderBlocks(lv);
    renderPuzzle(lv);
  }
}

/* ---------- 记录本 ---------- */
function renderLexicon() {
  const rootBox = $("#rootList");
  const suffixBox = $("#suffixList");

  if (state.roots.length === 0) {
    rootBox.innerHTML = `<div class="empty">尚未记录任何词根。</div>`;
  } else {
    rootBox.innerHTML = state.roots.map(w => `
      <div class="lex-item">
        <span class="sela">${w}</span>
        <span class="cn">${ALL_ROOTS[w] || "?"}</span>
      </div>
    `).join("");
  }

  if (state.suffixes.length === 0) {
    suffixBox.innerHTML = `<div class="empty">尚未记录任何后缀。</div>`;
  } else {
    suffixBox.innerHTML = state.suffixes.map(w => `
      <div class="lex-item suffix">
        <span class="sela">-${w}</span>
        <span class="cn">${ALL_SUFFIXES[w] || "?"}</span>
      </div>
    `).join("");
  }
}

/* ---------- 音频按钮 ---------- */
function renderAudio(lv) {
  const controls = $("#audioControls");
  const note = $("#audioNote");
  controls.innerHTML = "";
  note.textContent = "";

  if (!lv.audios || !lv.audios.length) return;

  lv.audios.forEach((a, i) => {
    const btn = document.createElement("button");
    btn.className = "audio-btn" + (i > 0 ? " hint" : "");
    btn.innerHTML = `<span class="icon">●</span>${a.label}`;

  btn.onclick = () => {
    document.querySelectorAll(".audio-btn").forEach(b => b.classList.remove("playing"));
    btn.classList.add("playing");

  // 每次点击都先隐藏内心独白
    const iv = $("#innerVoice");
    if (iv) {
      iv.classList.remove("show");
      iv.textContent = "";
    }

    playAudio(a.file, (playing) => {
      if (!playing) {
        btn.classList.remove("playing");

      // 主音频结束后，延迟显示内心独白
        if (a.id === "main" && lv.innerVoice) {
          setTimeout(() => {
            const iv2 = $("#innerVoice");
            if (iv2) {
              iv2.textContent = lv.innerVoice;
              iv2.classList.add("show");
            }
          }, 1200);
        }
      }
    });

    if (a.note) note.textContent = a.note;
  };

    controls.appendChild(btn);
  });
}

/* ---------- 频谱块 ---------- */
function renderBlocks(lv) {
  const box = $("#spectrum");
  box.innerHTML = "";
  box.classList.remove("compare-mode");

  if (!lv.blocks || !lv.blocks.length) return;

  lv.blocks.forEach(block => {
    const el = document.createElement("div");
    el.className = "spec-block " + (block.type || "root");

    const bars = generateBars(block.text, 14);
    const waveHTML = bars.map(h => `<span style="height:${h}px"></span>`).join("");

    el.innerHTML = `
      <div class="spec-wave">${waveHTML}</div>
      <div class="spec-text">${block.text}</div>
      <div class="spec-label">${block.type === "suffix" ? "后缀" : "词根"}</div>
    `;

    el.onclick = () => {
      if (!block.audio) return;
      document.querySelectorAll(".spec-block").forEach(b => b.classList.remove("playing"));
      el.classList.add("playing");
      playAudio(block.audio, (playing) => {
        if (!playing) el.classList.remove("playing");
      });
    };

    box.appendChild(el);
  });
}

/* ---------- 问题区 ---------- */
function renderPuzzle(lv) {
  const p = $("#puzzle");

  p.innerHTML = `
    <div class="question-row">
      <div class="question-label">${lv.question}</div>
      <div class="input-row">
        <input type="text" id="answer" placeholder="输入你的解读…" autocomplete="off" spellcheck="false">
        <button class="btn primary" id="submit">提交</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  `;

  const input = $("#answer");
  const submit = () => {
    const v = norm(input.value);
    if (!v) return;
    if (lv.accepts.some(a => norm(a) === v)) {
      $("#feedback").className = "feedback good";
      $("#feedback").textContent = "正确。";
      setTimeout(() => finishLevel(lv), 400);
    } else {
      $("#feedback").className = "feedback";
      $("#feedback").textContent = "不对。再听一次，或者看看频谱。";
      input.classList.add("shake");
      setTimeout(() => input.classList.remove("shake"), 400);
    }
  };

  $("#submit").onclick = submit;
  input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  input.focus();
}
/* ---------- 对照关 ---------- */
function renderCompare(lv) {
  // 频谱区
  const spec = $("#spectrum");
  spec.innerHTML = "";
  spec.classList.add("compare-mode");

  // 已知词栏
  if (lv.known && lv.known.length) {
    const knownBox = document.createElement("div");
    knownBox.className = "known-bar";
    knownBox.innerHTML = `<span class="known-label">已 知</span>` +
      lv.known.map(k => {
        const cls = k.type === "suffix" ? "suffix" : "root";
        const text = k.type === "suffix" ? "-" + k.text.replace(/^-/, "") : k.text;
        return `<span class="known-item ${cls}"><span class="sela">${text}</span><span class="cn">${k.cn}</span></span>`;
      }).join("");
    spec.appendChild(knownBox);
  }

  // 三组对照
  lv.pairs.forEach(pair => {
    const row = document.createElement("div");
    row.className = "compare-row";

    const left = document.createElement("div");
    left.className = "compare-left";

    pair.devil.forEach(b => {
      const block = document.createElement("div");
      block.className = "spec-block " + (b.type || "root");
      const bars = generateBars(b.text, 12);
      const waveHTML = bars.map(h => `<span style="height:${h}px"></span>`).join("");
      block.innerHTML = `
        <div class="spec-wave">${waveHTML}</div>
        <div class="spec-text">${b.text}</div>
      `;
      block.onclick = () => {
        if (!b.audio) return;
        document.querySelectorAll(".spec-block").forEach(x => x.classList.remove("playing"));
        block.classList.add("playing");
        playAudio(b.audio, (playing) => { if (!playing) block.classList.remove("playing"); });
      };
      left.appendChild(block);
    });

    const right = document.createElement("div");
    right.className = "compare-right";
    right.textContent = pair.cn;

    row.appendChild(left);
    row.appendChild(right);
    spec.appendChild(row);
  });

  // 问题区
  const p = $("#puzzle");
  p.innerHTML = `
    <div class="question-row">
      <div class="question-label">${lv.question}</div>
      <div class="compare-answers" id="compareAnswers"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  `;

  const container = $("#compareAnswers");
  const done = lv.answers.map(() => false);

  lv.answers.forEach((item, i) => {
    const row = document.createElement("div");
    row.className = "compare-answer-row";

    const label = document.createElement("span");
    label.className = "compare-answer-label";
    label.textContent = item.word;
    row.appendChild(label);

    const eq = document.createElement("span");
    eq.className = "compare-answer-eq";
    eq.textContent = "=";
    row.appendChild(eq);

    const input = document.createElement("input");
    input.type = "text";
    input.className = "compare-answer-input";
    input.placeholder = "输入含义…";
    input.autocomplete = "off";
    input.spellcheck = false;
    row.appendChild(input);

    const btn = document.createElement("button");
    btn.className = "btn primary compare-answer-btn";
    btn.textContent = "确认";
    row.appendChild(btn);

    const fb = document.createElement("span");
    fb.className = "compare-answer-fb";
    row.appendChild(fb);

    const check = () => {
      if (done[i]) return;
      const v = norm(input.value);
      if (!v) return;
      if (item.accepts.some(a => norm(a) === v)) {
        done[i] = true;
        input.value = item.meaning;
        input.disabled = true;
        btn.disabled = true;
        btn.textContent = "✓";
        fb.className = "compare-answer-fb good";
        fb.textContent = "✓";
        if (done.every(Boolean)) {
          $("#feedback").className = "feedback good";
          $("#feedback").textContent = "全部正确。";
          setTimeout(() => finishLevel(lv), 700);
        }
      } else {

    left.className = "compare-left";

    lv.callerWords.forEach(b => {
      const block = document.createElement("div");
      block.className = "spec-block " + (b.type || "root");
      const bars = generateBars(b.text, 12);
      block.innerHTML = `
        <div class="spec-wave">${bars.map(h => `<span style="height:${h}px"></span>`).join("")}</div>

  // 整段重听按钮
  if (lv.callerAudio) {
    const btn = document.createElement("button");
    btn.className = "audio-btn";
    btn.innerHTML = `<span class="icon">●</span>▶ 重听这段声音`;
    btn.onclick = () => {
      document.querySelectorAll(".audio-btn").forEach(b => b.classList.remove("playing"));
      btn.classList.add("playing");
      playAudio(lv.callerAudio, (playing) => { if (!playing) btn.classList.remove("playing"); });
    };
    spec.appendChild(btn);

  // 谜题区
  p.innerHTML = `

        <input type="text" id="playerInput" placeholder="对着电话说吧…" autocomplete="off" spellcheck="false" maxlength="50">
        <button class="btn primary" id="sayBtn">说</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  `;

  const input = $("#playerInput");
  const btn = $("#sayBtn");

  const submit = () => {
    const v = input.value.trim();
    if (!v) return;

    // 有预期答案时（K10），校验
    if (lv.stage1Accepts && lv.stage1Accepts.length) {
      if (lv.stage1Accepts.some(a => norm(a) === norm(v))) {
        input.disabled = true;
        btn.disabled = true;
        $("#feedback").className = "feedback good";
        $("#feedback").textContent = "对面沉默了。";
        setTimeout(() => {
          state.commStage = 2;

          btn.disabled = false;

        input.disabled = false;
        btn.disabled = false;
        input.value = "";
        input.focus();
      }, 3400);
      return;
    }

    state.playerWords = v;
    try { localStorage.setItem("player_words", v); } catch (e) {}
    state.commStage = 2;
    renderComm(lv);
  };

  btn.onclick = submit;
  input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });

/* ---------- 彩蛋判定 ---------- */
function isEasterEgg(text) {
  const t = text.trim();
  const lower = t.toLowerCase();
  return t.includes("塞拉") || t.includes("剑与盾") ||
         lower.includes("sela") || lower.includes("sword") ||
         lower.includes("shield");
}

  const overlay = document.createElement("div");

  const pieces = [];
  for (let i = 0; i < 90; i++) {
    const x = Math.random() * 92;

function renderTimeline(lv) {
  const spec = $("#spectrum");

  spec.innerHTML = "";
  spec.classList.remove("compare-mode");
  p.innerHTML = "";

  // 当前时间点（默认"现在"）
  let currentTime = lv.times.find(t => t.id === "now") || lv.times[0];
  let timeIndex = lv.times.indexOf(currentTime);

  // 时间轴按钮

  nav.className = "timeline-nav";

  lv.times.forEach((t, i) => {
    const btn = document.createElement("button");
    btn.className = "timeline-btn" + (i === timeIndex ? " active" : "");
    btn.textContent = t.label;

      if (i === timeIndex) return;
      timeIndex = i;
      currentTime = lv.times[i];
      nav.querySelectorAll(".timeline-btn").forEach((b, j) => {
        b.classList.toggle("active", j === i);

  audioRow.className = "timeline-audio-row";

  const renderSentence = () => {
    sentenceBox.classList.add("fading");
    setTimeout(() => {
      sentenceBox.innerHTML = "";

      const addBlock = (b) => {
        const block = document.createElement("div");
        block.className = "spec-block " + (b.type || "root");

          block.classList.add("playing");

        };
        sentenceBox.appendChild(block);
      };

      // 主语
      lv.subject.forEach(addBlock);

      addBlock({
        text: currentTime.suffix,
        type: "suffix",
        audio: currentTime.suffixAudio
      });
      // 宾语
      currentTime.object.forEach(addBlock);

      sentenceBox.classList.remove("fading");

      // 音频按钮

      const playBtn = document.createElement("button");
      playBtn.className = "audio-btn";

  p.innerHTML = `
    <div class="question-row">
      <div class="question-label">${lv.question}</div>

    label.textContent = item.word;
    row.appendChild(label);

    eq.className = "compare-answer-eq";
    eq.textContent = "=";
    row.appendChild(eq);

    const input = document.createElement("input");
    input.type = "text";
    input.className = "compare-answer-input";
    input.placeholder = "输入含义…";
    input.autocomplete = "off";
    input.spellcheck = false;
    row.appendChild(input);

    const btn = document.createElement("button");
    btn.className = "btn primary compare-answer-btn";
    btn.textContent = "确认";
    row.appendChild(btn);

    const fb = document.createElement("span");
    fb.className = "compare-answer-fb";
    row.appendChild(fb);

    const check = () => {
      if (done[i]) return;
      const v = norm(input.value);
      if (!v) return;
      if (item.accepts.some(a => norm(a) === v)) {
        done[i] = true;
        input.value = item.meaning;
        input.disabled = true;

        btn.textContent = "✓";
        fb.className = "compare-answer-fb good";
        fb.textContent = "✓";
        if (done.every(Boolean)) {
          $("#feedback").className = "feedback good";

        fb.textContent = "不对";

        setTimeout(() => input.classList.remove("shake"), 400);

/* ---------- 回话关 ---------- */
function renderReply(lv) {
  // 首次进入本关时初始化
  if (state.replyKey !== lv.key) {
    state.replyKey = lv.key;
    state.replyRound = 0;
    state.replyResults = [];
    state.replyAttempt = 1;
  }

  const spec = $("#spectrum");
  const p = $("#puzzle");

  spec.innerHTML = "";
  spec.classList.remove("compare-mode");
  p.innerHTML = "";

  // 三轮结束，判断结果
  if (state.replyRound >= lv.rounds.length) {
    return checkReplyResult(lv);
  }

  const round = lv.rounds[state.replyRound];
  const attemptLabel = state.replyAttempt > 1 ? " · 重来" : "";

  p.innerHTML = `
    <div class="reply-round-info">第 ${state.replyRound + 1} / ${lv.rounds.length} 轮${attemptLabel}</div>
    <div class="reply-caller">
      <div class="reply-caller-label">对 面 说</div>
      <div class="reply-caller-line">
        <div class="spec-block root" id="callerBlock">
          <div class="spec-text">${round.caller.text}</div>
        </div>
      </div>
      <div class="reply-caller-cn">${round.caller.cn}</div>
    </div>
    <div class="reply-options" id="replyOptions"></div>
    <div class="reply-feedback" id="replyFeedback"></div>
  `;

  // 点击对面那句话，播放音频
  const callerBlock = $("#callerBlock");
  if (callerBlock && round.caller.audio) {
    callerBlock.style.cursor = "pointer";
    callerBlock.onclick = () => {
      callerBlock.classList.add("playing");
      playAudio(round.caller.audio, (playing) => { if (!playing) callerBlock.classList.remove("playing"); });
    };
  }

  const optionsBox = $("#replyOptions");

  round.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "reply-option";
    btn.innerHTML = `
      <span class="reply-option-label">${String.fromCharCode(65 + i)}</span>
      <span class="reply-option-text">${opt.text}</span>
      <span class="reply-option-cn">${opt.cn}</span>
    `;

    btn.onclick = () => {
      // 禁用所有选项
      optionsBox.querySelectorAll(".reply-option").forEach(b => b.classList.add("disabled"));

      if (opt.correct) {
        btn.classList.add("correct");
        state.replyResults.push(true);
        $("#replyFeedback").className = "reply-feedback good";
        $("#replyFeedback").textContent = "对面接受了。";
      } else {
        btn.classList.add("wrong");
        state.replyResults.push(false);
        // 高亮正确选项
        const correctIdx = round.options.findIndex(o => o.correct);
        if (correctIdx >= 0) {
          optionsBox.children[correctIdx].classList.add("correct");
        }
        $("#replyFeedback").className = "reply-feedback warn";
        $("#replyFeedback").textContent = "对面没有回应这句。";
      }

      setTimeout(() => {
        state.replyRound++;
        renderReply(lv);
      }, 1400);
    };

    optionsBox.appendChild(btn);
  });
}

/* ---------- 判断三轮结果 ---------- */
function checkReplyResult(lv) {
  const allWrong = state.replyResults.every(r => r === false);

  // 全错：第一次重来
  if (allWrong && state.replyAttempt === 1) {
    showReplyInterlude("对面沉默了。\n\n它在等你重新回答。", () => {
      state.replyRound = 0;
      state.replyResults = [];
      state.replyAttempt = 2;
      renderReply(lv);
    });
    return;
  }

  // 全错：第二次进入隐藏分支
  if (allWrong && state.replyAttempt === 2) {
    return showHiddenBranch();
  }

  // 至少答对一道，正常通过
  finishLevel(lv);
}

/* ---------- 中途过场 ---------- */
function showReplyInterlude(text, cb) {
  const spec = $("#spectrum");
  const p = $("#puzzle");

  spec.innerHTML = "";
  p.innerHTML = `
    <div style="text-align:center;padding:60px 20px;animation:fadeIn 1s;">
      <p style="font-size:15px;line-height:2.2;color:#8a9cb5;letter-spacing:0.1em;white-space:pre-line;">${text}</p>

/* ---------- 关键词匹配 ---------- */
function matchKeyword(text, order) {
  const t = text.toLowerCase();
  for (const k of order) {
    const kLower = k.toLowerCase();
    if (kLower === "vai va zo") {
      // 塞拉语短语，检查是否包含 vai、va、zo 三词（任意顺序、任意分隔）
      const parts = t.replace(/[\s,，。.!！?？]/g, " ").split(/\s+/);
      if (parts.includes("vai") && parts.includes("va") && parts.includes("zo")) {
        return k;
      }
      if (t.includes("vaivazo") || t.includes("vai va zo")) return k;
    } else if (kLower === "sela") {
      if (t.includes("sela")) return k;
    } else {
      if (t.includes(kLower)) return k;
    }
  }
  return null;
}

  const spec = $("#spectrum");

  // 话题词栏
  const topicsBox = document.createElement("div");

  topicsBox.innerHTML = `<span class="essay-topics-label">话 题</span>` +
    lv.topics.map(t => `
      <span class="topic-chip" data-word="${t.word}">
        ${t.word}<span class="topic-cn">${t.cn}</span>
      </span>
    `).join("");
  spec.appendChild(topicsBox);

  // 书写区
  p.innerHTML = `
    <div class="question-row">
      <div class="question-label">${lv.question}</div>
      <textarea id="essayInput" class="essay-box" placeholder="${lv.placeholder || "写点什么…"}"></textarea>
      <div class="essay-status">
        <span class="essay-count" id="essayCount">0 字</span>
        <span id="topicStatus">0 / ${lv.topics.length} 话题词</span>
      </div>
      <div class="input-row" style="margin-top:16px;">
        <button class="btn primary" id="essaySubmit">交 出</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  `;

  const textarea = $("#essayInput");
  const countEl = $("#essayCount");
  const statusEl = $("#topicStatus");
  const submitBtn = $("#essaySubmit");

  const updateUI = () => {
    const text = textarea.value;
    countEl.textContent = text.length + " 字";

    let used = 0;
    lv.topics.forEach(t => {
      const chip = topicsBox.querySelector(`[data-word="${t.word}"]`);
      if (text.toLowerCase().includes(t.word.toLowerCase())) {
        chip.classList.add("used");
        used++;
      } else {
        chip.classList.remove("used");
      }
    });

    statusEl.textContent = `${used} / ${lv.topics.length} 话题词`;
    const allUsed = used === lv.topics.length;
    const longEnough = text.length >= (lv.minLength || 20);
    countEl.className = "essay-count" + (allUsed && longEnough ? " ready" : "");
  };

  textarea.addEventListener("input", updateUI);
  textarea.focus();
  updateUI();

  const submit = () => {
    const text = textarea.value.trim();
    if (!text) return;

    // 检查长度
    if (text.length < (lv.minLength || 20)) {
      $("#feedback").className = "feedback";
      $("#feedback").textContent = `再写长一点。至少 ${lv.minLength || 20} 字。`;
      textarea.classList.add("shake");
      setTimeout(() => textarea.classList.remove("shake"), 400);
      return;
    }

    // 检查话题词
    const missing = lv.topics.filter(t => !text.toLowerCase().includes(t.word.toLowerCase()));
    if (missing.length > 0) {
      $("#feedback").className = "feedback";
      $("#feedback").textContent = `还没有写到：${missing.map(m => m.word).join("、")}`;
      textarea.classList.add("shake");
      setTimeout(() => textarea.classList.remove("shake"), 400);
      return;
    }

    // 保存笔记
    saveNote(text);

    state.essayText = text;
    $("#feedback").className = "feedback good";
    $("#feedback").textContent = "已记入笔记。";

    textarea.disabled = true;
    submitBtn.disabled = true;

    setTimeout(() => finishLevel(lv), 800);
  };

  submitBtn.onclick = submit;
}

/* =========================================================

   ========================================================= */
function saveNote(text, tag) {
  try {
    const raw = localStorage.getItem("freq_notes");
    const notes = raw ? JSON.parse(raw) : [];
    const now = new Date();
    const pad = n => String(n).padStart(2, "0");
    const time = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    notes.push({ time, text, tag: tag || "" });
    localStorage.setItem("freq_notes", JSON.stringify(notes));
  } catch (e) {}
}

function loadNotes() {
  try {
    const raw = localStorage.getItem("freq_notes");
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

/* 在笔记正文里高亮已学的词根 */
function highlightRoots(text) {
  if (!text) return "";
  // 转义 HTML
  let safe = text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  // 按长度倒序，避免短词抢先替换
  const roots = state.roots.slice().sort((a, b) => b.length - a.length);
  roots.forEach(r => {
    if (!r || r.length < 2) return;
    const re = new RegExp(`(${r})(?![a-zA-Z])`, "gi");
    safe = safe.replace(re, `<span class="dc-root">$1</span>`);
  });
  return safe;
}

/* 记忆检查 */
function renderTemptationMemory(lv) {
  const overlay = document.createElement("div");
  overlay.className = "memory-overlay";

  overlay.innerHTML = `
    <div class="memory-box">
      <div class="memory-prompt">${lv.memoryPrompt}</div>
      <div class="memory-input-row">
        <input type="text" id="memoryInput" class="memory-input" placeholder="输入你的回答…" autocomplete="off" spellcheck="false" maxlength="80">
      </div>
      <button class="memory-submit" id="memorySubmit">确 认</button>
      <div class="memory-feedback" id="memoryFeedback"></div>
    </div>
  `;

  document.body.appendChild(overlay);

  const input = overlay.querySelector("#memoryInput");
  const submitBtn = overlay.querySelector("#memorySubmit");
  const fb = overlay.querySelector("#memoryFeedback");

  const check = () => {
    const v = input.value.trim();
    const playerWords = localStorage.getItem("player_words") || "";

    // 归一化比较：忽略大小写、空格、标点
    const normFn = s => (s || "")
      .replace(/[\s，。！？、,.!?；;：:"'“”‘’（）()《》「」『』…—\-]/g, "")
      .toLowerCase();

    const userNorm = normFn(v);
    const targetNorm = normFn(playerWords);

    // 留空 = 放弃
    if (!userNorm) {
      overlay.remove();
      state.temptationStage = 2;
      renderTemptation(lv);
      return;
    }

    if (userNorm === targetNorm) {
      // 正确：进入结局 1
      fb.style.color = "#6fbf73";
      fb.textContent = "你想起来了。";
      input.disabled = true;
      submitBtn.disabled = true;
      setTimeout(() => {
        overlay.remove();
        renderEnding1Return();
      }, 1800);
    } else {
      // 错误：回到选择界面
      fb.textContent = "不是这个。";
      input.classList.add("shake");
      setTimeout(() => input.classList.remove("shake"), 400);
      setTimeout(() => {
        overlay.remove();
        state.temptationStage = 2;
        renderTemptation(lv);
      }, 1600);
    }
  };

  submitBtn.onclick = check;
  input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  setTimeout(() => input.focus(), 2200);
}

/* =========================================================
   终局关
   ========================================================= */
function renderFinale(lv) {
  if (state.finaleKey !== lv.key) {
    state.finaleKey = lv.key;
    state.finaleStage = 0;
  }

  if (state.finaleStage === 0) return renderFinaleScene(lv, false);
  if (state.finaleStage === 1) return renderFinaleScene(lv, true);
}

function renderFinaleScene(lv, secondTime) {
  const spec = $("#spectrum");
  const p = $("#puzzle");

  spec.innerHTML = "";
  spec.classList.remove("compare-mode");
  p.innerHTML = "";

  // 显示玩家笔记
  const notes = loadNotes();
  const latestNote = notes.length > 0 ? notes[notes.length - 1].text : "（你没有写下任何东西。）";

  const noteBlock = document.createElement("div");
  noteBlock.className = "finale-note-display";
  noteBlock.innerHTML = `
    <div class="finale-note-label">你 写 下 的</div>
    <div class="finale-note-body">${highlightRoots(latestNote)}</div>
  `;
  spec.appendChild(noteBlock);

  // 对面说话
  const monoBlock = document.createElement("div");
  monoBlock.className = "monologue-block";
  monoBlock.style.animationDelay = "0.4s";
  monoBlock.innerHTML = `
    <div class="dialogue-label">对 面 说</div>
    ${lv.monologue.map(line => `<div class="monologue-line">${line}</div>`).join("")}
  `;
  spec.appendChild(monoBlock);

  // 两个选择
  p.innerHTML = `
    <div class="finale-choice">
      <button class="finale-choice-btn" id="writeBtn">${lv.choiceTexts.write}</button>
      <button class="finale-choice-btn danger" id="refuseBtn">${lv.choiceTexts.refuse}</button>
    </div>
  `;

  $("#writeBtn").onclick = () => {
    renderEnding2Accomplice();
  };

  $("#refuseBtn").onclick = () => {
    renderEnding3Peace();
  };
}

/* =========================================================
   过关
   ========================================================= */
function finishLevel(lv) {
  if (lv.learned) {
    const items = Array.isArray(lv.learned) ? lv.learned : [lv.learned];
    items.forEach(item => {
      if (item.type === "root" && !state.roots.includes(item.word)) {
        state.roots.push(item.word);
      }
      if (item.type === "suffix" && !state.suffixes.includes(item.word)) {
        state.suffixes.push(item.word);
      }
    });
  }

  state.level++;
  save();
  
  showReveal(lv.reveal || "信号中断。", () => {
    if (state.level >= state.levels.length) renderEnding();
    else render();
  });
}

function showReveal(text, cb) {
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="reveal-box">
      <p>${text}</p>
      <button class="btn primary">继续</button>
    </div>
  `;
  overlay.querySelector("button").onclick = () => {
    overlay.remove();
    cb();
  };
  document.body.appendChild(overlay);
}

}

/* =========================================================
   重开
   ========================================================= */
function restartGame() {
  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  overlay.innerHTML = `
    <div class="confirm-box">
      <p>确定要重新开始吗？<br>当前的进度会被清空。</p>
      <div class="confirm-actions">
        <button class="btn" id="cancelRestart" style="background:transparent;border:1px solid #3a2020;color:#8a7f6e;">取消</button>
        <button class="btn primary" id="confirmRestart">重开</button>
      </div>
    </div>
  `;
  overlay.querySelector("#cancelRestart").onclick = () => overlay.remove();
  overlay.querySelector("#confirmRestart").onclick = () => {
    localStorage.removeItem("freq_save");
    location.reload();
  };
  document.body.appendChild(overlay);
}

document.addEventListener("click", e => {
  if (e.target && e.target.id === "restartBtn") restartGame();
  if (e.target && e.target.id === "notesBtn") showNotes();
});

/* =========================================================
   开发者模式
   ---------------------------------------------------------
   ?dev=reset      清空存档
   ?dev=stage&n=2  跳到第 2 关（按索引，0 起算）
   ========================================================= */
function devMode() {
  const params = new URLSearchParams(location.search);
  const dev = params.get("dev");
  if (!dev) return;

  if (dev === "reset") {
    localStorage.removeItem("freq_save");
    console.log("%c[DEV]", "color:#c84444;font-weight:bold;", "存档已清空");
  }
  if (dev === "stage") {
    const n = parseInt(params.get("n") || "0", 10);
    try {
      localStorage.setItem("freq_save", JSON.stringify({
        level: n,
        roots: [],
        suffixes: []
      }));
      console.log("%c[DEV]", "color:#c84444;font-weight:bold;", "跳到第 " + n + " 关");
    } catch (e) {}
  }
}

/* =========================================================
   启动
   ========================================================= */
devMode();
load();
render();
