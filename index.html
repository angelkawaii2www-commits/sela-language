<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遗语 · 塞拉</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #0a0806;
    background-image: radial-gradient(ellipse at 50% -20%, #241b12 0%, transparent 60%);
    color: #ddd3c4;
    font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
    padding: 24px 16px 60px;
    display: flex;
    justify-content: center;
  }

  .app { width: min(1180px, 100%); }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 16px;
    border-bottom: 1px solid #2a2118;
    margin-bottom: 24px;
  }

  .brand {
    font-size: 22px;
    letter-spacing: 0.4em;
    color: #c8a24a;
    text-shadow: 0 0 24px #c8a24a44;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .progress {
    font-size: 13px;
    color: #8a7f6e;
    letter-spacing: 0.15em;
  }

  .progress.special {
    color: #d97070;
    letter-spacing: 0.3em;
    animation: progressPulse 1.6s infinite;
    text-shadow: 0 0 18px #d9707066;
  }

  @keyframes progressPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  .btn-restart {
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.2em;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    background: transparent;
    border: 1px solid #332a1e;
    color: #8a7f6e;
    transition: all .18s;
  }

  .btn-restart:hover {
    border-color: #c8a24a;
    color: #c8a24a;
  }

  .grid {
    display: grid;
    grid-template-columns: 1.05fr 1.2fr 0.8fr;
    gap: 18px;
    align-items: start;
  }

  @media (max-width: 980px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: linear-gradient(180deg, #16120d, #110e0a);
    border: 1px solid #2a2118;
    border-radius: 10px;
    padding: 20px;
    min-height: 120px;
  }

  .panel h2 {
    font-size: 12px;
    letter-spacing: 0.3em;
    color: #8a7f6e;
    font-weight: normal;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid #241d15;
  }

  .scene-img-wrap {
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    background: #0d0b08;
    border: 1px solid #241d15;
    margin-bottom: 16px;
    min-height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scene-img-wrap img {
    width: 100%;
    height: auto;
    display: block;
  }

  .img-placeholder {
    padding: 28px 20px;
    text-align: center;
    color: #6d6355;
    font-size: 13px;
    line-height: 1.9;
    width: 100%;
  }

  .img-placeholder .ph-icon {
    font-size: 30px;
    opacity: 0.35;
    margin-bottom: 10px;
  }

  .img-placeholder .ph-file {
    color: #c8a24a;
    font-family: "Courier New", monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
    word-break: break-all;
  }

  #clueTitle {
    font-size: 18px;
    color: #e8c876;
    margin-bottom: 12px;
    letter-spacing: 0.1em;
  }

  #clueText {
    font-size: 14px;
    line-height: 2;
    color: #b3a894;
  }

  .sela {
    font-family: "Courier New", ui-monospace, monospace;
    letter-spacing: 0.2em;
    color: #e8c876;
    font-size: 17px;
    font-weight: bold;
  }

  .line {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 14px 0;
    border-bottom: 1px dashed #241d15;
  }

  .line:last-of-type { border-bottom: none; }

  .tag {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: #6d6355;
    border: 1px solid #332a1e;
    border-radius: 3px;
    padding: 3px 8px;
    flex-shrink: 0;
  }

  .eq { color: #6d6355; }
  .cn { color: #ddd3c4; font-size: 16px; }

  .input-row {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  input[type="text"] {
    flex: 1;
    background: #0d0b08;
    border: 1px solid #332a1e;
    border-radius: 6px;
    padding: 12px 14px;
    color: #e8c876;
    font-family: inherit;
    font-size: 16px;
    outline: none;
    transition: border-color .2s;
    min-width: 0;
  }

  input[type="text"]:focus { border-color: #c8a24a; }
  input[type="text"]::placeholder { color: #4d453a; }

  .btn {
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.1em;
    padding: 12px 22px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all .18s;
    white-space: nowrap;
  }

  .btn.primary {
    background: #c8a24a;
    color: #0a0806;
    font-weight: bold;
  }

  .btn.primary:hover { background: #e8c876; }

  .btn.ghost {
    background: transparent;
    border-color: #332a1e;
    color: #8a7f6e;
    margin-top: 14px;
    font-size: 13px;
    padding: 8px 16px;
  }

  .btn.ghost:hover { border-color: #c8a24a; color: #c8a24a; }

  .feedback {
    min-height: 22px;
    margin-top: 12px;
    font-size: 14px;
    color: #d97070;
    line-height: 1.7;
  }

  .feedback.good { color: #6fbf73; }

  .no-hint {
    margin-top: 14px;
    font-size: 12px;
    color: #6d6355;
    letter-spacing: 0.2em;
    font-style: italic;
  }

  /* ---------- 单词卡 ---------- */
  .word-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
    margin-top: 8px;
  }

  .word-card {
    background: #0d0b08;
    border: 1px solid #332a1e;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    transition: all .35s;
  }

  .word-card.revealed {
    border-color: #c8a24a66;
    box-shadow: 0 0 26px #c8a24a22;
  }

  .word-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 6px;
    overflow: hidden;
    background: #16120d;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .word-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .word-img-ph {
    padding: 10px;
    color: #6d6355;
    font-size: 11px;
    line-height: 1.6;
    text-align: center;
  }

  .word-img-ph .ph-icon {
    font-size: 22px;
    opacity: 0.35;
    margin-bottom: 6px;
  }

  .word-img-ph .ph-file {
    color: #c8a24a;
    font-family: monospace;
    font-size: 10px;
    word-break: break-all;
    margin-bottom: 4px;
  }

  .word-sela {
    font-family: "Courier New", monospace;
    font-size: 22px;
    letter-spacing: 0.2em;
    color: #e8c876;
    font-weight: bold;
    margin-bottom: 8px;
  }

  .word-input {
    width: 100%;
    background: #0d0b08;
    border: 1px solid #332a1e;
    border-radius: 6px;
    padding: 8px 10px;
    color: #e8c876;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    text-align: center;
    margin-bottom: 8px;
    transition: all .2s;
  }

  .word-input:focus { border-color: #c8a24a; }
  .word-input::placeholder { color: #4d453a; }
  .word-input:disabled {
    background: #101a10;
    color: #6fbf73;
    border-color: #3a5c3c;
    cursor: default;
  }

  .reveal-btn {
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.15em;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    background: transparent;
    border: 1px solid #332a1e;
    color: #8a7f6e;
    transition: all .18s;
    width: 100%;
  }

  .reveal-btn:hover {
    border-color: #c8a24a;
    color: #c8a24a;
  }

  .word-feedback {
    min-height: 18px;
    font-size: 12px;
    color: #d97070;
    margin-top: 6px;
    line-height: 1.5;
  }

  .word-feedback.good { color: #6fbf73; }

  /* ---------- 词典 ---------- */
  #lexicon {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 520px;
    overflow-y: auto;
  }

  .lex-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: #0d0b08;
    border-radius: 6px;
    border-left: 2px solid #c8a24a55;
    animation: fadeIn .4s;
  }

  .lex-item .sela { font-size: 15px; }
  .lex-item .cn { font-size: 14px; color: #a89b86; }

  .empty { color: #4d453a; font-size: 14px; line-height: 1.8; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- 碑文 ---------- */
  .inscription {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 18px 0 8px;
  }

  .insc-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 12px 14px;
    border-radius: 6px;
    background: #0d0b08;
    border: 1px solid transparent;
    opacity: .35;
    transition: all .3s;
  }

  .insc-line.active {
    opacity: 1;
    border-color: #c8a24a55;
    box-shadow: 0 0 20px #c8a24a22;
  }

  .insc-line.done {
    opacity: 1;
    border-color: #3a5c3c;
  }

  .insc-line.done .cn { color: #6fbf73; }

  /* ---------- 特殊关 ---------- */
  #puzzle.special-mode {
    position: relative;
  }

  #puzzle.special-mode::before {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 12px;
    pointer-events: none;
    border: 1px solid #d9707033;
    box-shadow: 0 0 32px #d9707022 inset;
    animation: specialGlow 2.4s infinite;
  }

  @keyframes specialGlow {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 1; }
  }

  #puzzle.special-mode .sela {
    color: #f08484;
    text-shadow: 0 0 16px #d9707055;
  }

  #puzzle.special-mode .line {
    border-bottom-color: #d9707022;
  }

  #puzzle.special-mode .tag {
    border-color: #d9707044;
    color: #d97070;
  }

  /* ---------- 弹层 ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: #000000cc;
    display: grid;
    place-items: center;
    padding: 24px;
    z-index: 99;
    animation: fadeIn .3s;
  }

  .reveal-box {
    max-width: 500px;
    background: linear-gradient(180deg, #1a1510, #120f0b);
    border: 1px solid #c8a24a55;
    border-radius: 12px;
    padding: 34px 30px;
    text-align: center;
    box-shadow: 0 0 60px #c8a24a22;
    animation: fadeIn .45s;
  }

  .reveal-box p {
    font-size: 16px;
    line-height: 2;
    color: #ddd3c4;
    margin-bottom: 24px;
  }

  .confirm-overlay {
    position: fixed;
    inset: 0;
    background: #000000cc;
    display: grid;
    place-items: center;
    padding: 24px;
    z-index: 100;
    animation: fadeIn .2s;
  }

  .confirm-box {
    max-width: 380px;
    background: linear-gradient(180deg, #1a1510, #120f0b);
    border: 1px solid #c8a24a55;
    border-radius: 12px;
    padding: 30px 28px;
    text-align: center;
    box-shadow: 0 0 60px #c8a24a22;
  }

  .confirm-box p {
    font-size: 15px;
    line-height: 1.9;
    color: #ddd3c4;
    margin-bottom: 24px;
  }

  .confirm-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .confirm-actions .btn { margin-top: 0; }

  .shake { animation: shake .35s; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* ---------- 结局 ---------- */
  .ending {
    max-width: 640px;
    margin: 60px auto;
    text-align: center;
    animation: fadeIn 1.2s;
  }

  .ending h1 {
    font-size: 26px;
    letter-spacing: 0.4em;
    color: #c8a24a;
    margin-bottom: 44px;
  }

  .ending p {
    font-size: 16px;
    line-height: 2.2;
    color: #b3a894;
    margin-bottom: 12px;
  }

  .ending .ep { margin-top: 30px; color: #ddd3c4; }

  .ending .right p {
    color: #e8c876;
    font-size: 18px;
    letter-spacing: 0.08em;
  }

  .ending .btn { margin-top: 44px; }

  /* ---------- 黑影结局 ---------- */
  .shadow-scene {
    max-width: 620px;
    margin: 100px auto 0;
    text-align: center;
    animation: fadeIn 1.6s;
  }

  .shadow-figure {
    width: 160px;
    height: 220px;
    margin: 0 auto 56px;
    background: radial-gradient(ellipse at 50% 30%, #1a1a1a 0%, #050505 60%, transparent 100%);
    border-radius: 50% 50% 40% 40%;
    filter: blur(2px);
    animation: shadowBreathe 4s infinite ease-in-out;
  }

  .shadow-figure.fading {
    animation: shadowFade 2.4s forwards;
  }

  @keyframes shadowBreathe {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.04); opacity: 1; }
  }

  @keyframes shadowFade {
    0% { transform: scale(1); opacity: 1; filter: blur(2px); }
    100% { transform: scale(1.6); opacity: 0; filter: blur(24px); }
  }

  .shadow-line {
    font-size: 17px;
    line-height: 2.2;
    color: #b3a894;
    letter-spacing: 0.12em;
    margin-bottom: 10px;
    opacity: 0;
    animation: shadowLine 1.4s forwards;
  }

  .shadow-line:nth-child(2) { animation-delay: 1.4s; }
  .shadow-line:nth-child(3) { animation-delay: 2.8s; }
  .shadow-line:nth-child(4) { animation-delay: 4.2s; }

  @keyframes shadowLine {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .signature-box {
    margin-top: 40px;
    display: flex;
    gap: 10px;
    justify-content: center;
    opacity: 0;
    animation: shadowLine 1.4s 5.6s forwards;
  }

  .signature-box input {
    flex: 0 0 220px;
    background: #0d0b08;
    border: 1px solid #332a1e;
    border-radius: 6px;
    padding: 12px 14px;
    color: #e8c876;
    font-family: inherit;
    font-size: 16px;
    outline: none;
    text-align: center;
    letter-spacing: 0.15em;
  }

  .signature-box input:focus { border-color: #c8a24a; }
  .signature-box input::placeholder { color: #4d453a; letter-spacing: 0.08em; }

  .shadow-whisper {
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 15px;
    letter-spacing: 0.4em;
    color: #c8a24a;
    opacity: 0;
    pointer-events: none;
    text-shadow: 0 0 20px #c8a24a66;
    animation: whisper 3.6s ease-in-out;
    z-index: 200;
    white-space: nowrap;
  }

  @keyframes whisper {
    0% { opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">遗 语 · 塞 拉</div>
    <div class="header-right">
      <div class="progress" id="progress">第 1 / 23 关</div>
      <button class="btn-restart" id="restartBtn">重 开</button>
    </div>
  </header>

  <div class="grid">
    <section class="panel">
      <h2>现 场</h2>
      <div class="scene-img-wrap" id="imgWrap"></div>
      <div id="clueTitle"></div>
      <div id="clueText"></div>
    </section>

    <section class="panel">
      <h2>解 读</h2>
      <div id="puzzle"></div>
    </section>

    <aside class="panel">
      <h2>词 典</h2>
      <div id="lexicon"></div>
    </aside>
  </div>
</div>

<script>
/* =========================================================
   塞拉语词典
   ---------------------------------------------------------
   语法规则：
   1. 语序 VSO：动词 - 主语 - 宾语
   2. 形容词 / 数词 / 修饰词放在名词之前
   3. 时态词放在句首：yen（现在）、vai（将 / will）
   4. 名词修饰名词：de shi = 神的侍者
   5. 连接词 phi = 和 / 与，连接并列的名词
   ========================================================= */
const LEXICON = {
  // 人称
  mi: "我", ta: "你", ni: "他 / 她",
  // 名词
  xa: "水", lu: "光", de: "神 / 神明",
  ko: "塔", si: "生命", ye: "夜晚", sen: "圣诞",
  mo: "魔鬼", pi: "人民", pe: "信仰",
  zo: "末日", shi: "侍者", ron: "笼子",
  fu: "复活",
  // 形容词
  lo: "高的", po: "低的", an: "古代的", nu: "新的",
  tu: "两个 / 二", vi: "唯一的", on: "大的",
  // 动词
  ru: "喝", ka: "看见", va: "来",
  du: "居住", mu: "迷惑", ban: "转变",
  ha: "得到", li: "离开",
  // 时态 / 位置
  yen: "现在", vai: "将（will）", zai: "前面 / 之前",
  // 连接词
  phi: "和 / 与"
};

/* =========================================================
   关卡数据
   ---------------------------------------------------------
   key:     存档定位，唯一，永不变
   label:   显示用编号，可以是数字、浮点、特殊数字、字母
   special: 是否为特殊关（红色脉冲样式）
   kind:    "word" / "translate" / "inscription"
   ========================================================= */
const LEVELS = [
  /* ---------- 第一部分：基础 ---------- */
  {
    key: "L01", label: 1,
    kind: "word", title: "洞窟入口",
    scene: "手电的光束落在岩壁上。三个不同姿态的人影并排而列，每一道人影旁边，都刻着一个符号。",
    words: [
      { word: "mi", cn: "我", accepts: ["我"], image: "01a-mi.jpg", imageAlt: "一个人用手指着自己的胸口", imageHint: "一个人用手指着自己的胸口" },
      { word: "ta", cn: "你", accepts: ["你"], image: "01b-ta.jpg", imageAlt: "一个人用手指着另一个人", imageHint: "一个人用手指着另一个人" },
      { word: "ni", cn: "他 / 她", accepts: ["他", "她", "他/她", "他或她", "祂"], image: "01c-ni.jpg", imageAlt: "一个人用手指着远处的第三个人", imageHint: "一个人用手指着远处的第三个人" }
    ],
    learned: ["mi", "ta", "ni"],
    reveal: "mi 指向自己，ta 指向你，ni 指向他者。人称，是任何语言的起点。"
  },
  {
    key: "L02", label: 2,
    kind: "word", title: "三样东西",
    scene: "另一面墙上，画着三样截然不同的事物。每一幅的下方，都有一个符号。",
    words: [
      { word: "xa", cn: "水", accepts: ["水"], image: "02a-xa.jpg", imageAlt: "一片水面，或一个盛满水的碗", imageHint: "一片水面，或一个盛满水的碗" },
      { word: "lu", cn: "光", accepts: ["光", "光芒"], image: "02b-lu.jpg", imageAlt: "太阳或放射状的光芒", imageHint: "太阳或放射状的光芒" },
      { word: "de", cn: "神 / 神明", accepts: ["神", "神明"], image: "02c-de.jpg", imageAlt: "一个发光的高大身影", imageHint: "一个发光的高大身影，或戴着光环的人形" }
    ],
    learned: ["xa", "lu", "de"],
    reveal: "水，光，神。塞拉人最先命名的，是这三样东西。"
  },
  {
    key: "L03", label: 3,
    kind: "word", title: "三个动作",
    scene: "再往里走，壁画上的人影开始动了起来。三个动作各配一个符号，重复出现在不同场景中。",

      { text: "an tu de",         accepts: ["古代两位神明", "古代的两个神明", "古时两位神明", "古代两位神", "古代两个神", "古时两位神"] },
      { text: "du de lo ko",      accepts: ["神居住高塔", "神明居住在高塔", "神住在高塔", "神居住于高塔", "神明居住高塔", "神住在高塔上"] },
      { text: "vi lo si",         accepts: ["唯一至高生命", "唯一的至高生命", "唯一的高生命", "唯一至高存在", "唯一高生命"] },
      { text: "sen zai ye",       accepts: ["圣诞前夕", "圣诞前夜", "圣诞节前夜", "圣诞之前的夜晚", "圣诞前的夜晚"] },
      { text: "mu mo pi",         accepts: ["魔鬼迷惑人民", "魔鬼欺骗人民", "魔鬼迷惑了人民", "魔鬼蛊惑人民", "魔鬼迷惑着人民"] },
      { text: "ban pi pe",        accepts: ["人民转变信仰", "人民改变信仰", "人民转变了信仰", "人民改变了信仰", "人民改变信仰"] },
      { text: "yen ha de fu",     accepts: ["现在神明得到复活", "现在神明获得复活", "现在神得到复活", "如今神明得到复活", "现在神明得到重生"] },
      { text: "vai va zo",        accepts: ["末日将来", "末日将会来临", "末日会来", "末日将至", "末日将会到来", "末日将要来临", "末日即将来临"] },
      { text: "vai li de shi ron", accepts: ["神的侍者将离开笼子", "神明的侍者将离开笼子", "神的仆从将离开笼子", "神的侍者将要离开笼子", "神的侍者将走出笼子"] }
    ],
    reveal: "碑文读完了。但石碑的背面，还刻着一行更小的字。"
  }
];
/* =========================================================
   二周目关卡列表
   ========================================================= */
const LEVELS_2 = [
  {
  key: "R01", label: "-1",
  kind: "translate", title: "重来",
  image: "R01.jpg", imageAlt: "熟悉又陌生的岩壁",
  imageHint: "熟悉又陌生的岩壁",
  scene: "你再次站在这里。但这一次，符号有点不一样了。",
  known: { text: "va mi ti", cn: "我来这里" },
  prompt: "va mi ti",
  hint: null,
  accepts: ["我来这里", "我来到这里"],
  learned: [],
  reveal: "是的。你又来了。"
  }
];

/* =========================================================
   状态
   ========================================================= */
const state = {
  level: 0,
  known: [],
  inscStep: 0,
  inscAnswers: [],
  secondRun: false,
  introShown: false,
  levels: LEVELS
};

const $ = s => document.querySelector(s);

function save() {
  try {
    const lv = state.levels[state.level];
    const data = { known: state.known, level: state.level };
    if (lv && lv.key) data.key = lv.key;
    const saveKey = state.secondRun ? "sela_save_2" : "sela_save";
    localStorage.setItem(saveKey, JSON.stringify(data));
  } catch (e) {}
}

function load() {
  try {
    // 检测二周目
    state.secondRun = !!localStorage.getItem("sela_name");

    // 根据周目选择关卡列表
    state.levels = state.secondRun ? LEVELS_2 : LEVELS;

    // 根据周目选择存档 key
    const saveKey = state.secondRun ? "sela_save_2" : "sela_save";
    const raw = localStorage.getItem(saveKey);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (Array.isArray(d.known)) state.known = d.known;

    if (d.key) {
      const idx = state.levels.findIndex(l => l.key === d.key);
      if (idx >= 0) { state.level = idx; return; }
    }
    if (typeof d.level === "number" && d.level >= 0 && d.level < state.levels.length) {
      state.level = d.level;
    }
  } catch (e) {}
// 二周目继承一周目词典
    if (state.secondRun && state.known.length === 0) {
      try {
        const raw1 = localStorage.getItem("sela_save");
        if (raw1) {
          const d1 = JSON.parse(raw1);
          if (Array.isArray(d1.known)) state.known = d1.known;
        }
      } catch (e) {}
    }
}

function norm(s) {
  return (s || "")
    .replace(/[\s，。！？、,.!?；;：:"'“”‘’（）()《》「」『』…—\-]/g, "")
    .toLowerCase();
}

/* =========================================================
   图片占位
   ========================================================= */
function placeholderHTML(file, hint) {
  return `<div class="img-placeholder"><div class="ph-icon">🖼</div><div class="ph-file">${file}</div><div>${hint || "（放一张与此关相关的图片）"}</div></div>`;
}

function renderSceneImage(lv) {
  const wrap = $("#imgWrap");
  wrap.innerHTML = "";
  const img = document.createElement("img");
  img.src = lv.image;
  img.alt = lv.imageAlt || lv.title;
  img.loading = "lazy";
  img.onerror = () => { wrap.innerHTML = placeholderHTML(lv.image, lv.imageHint); };
  wrap.appendChild(img);
}

/* =========================================================
   低语（二周目）
   ========================================================= */
function whisper(text) {
  const el = document.createElement("div");
  el.className = "shadow-whisper";
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3800);
}

/* =========================================================
   渲染主流程
   ========================================================= */
function render() {
  const levels = state.levels;
  if (state.level >= levels.length) return renderEnding();
  const lv = levels[state.level];
  state.inscStep = 0;
  state.inscAnswers = [];

  // 二周目开场低语
  if (state.secondRun && state.level === 0 && !state.introShown) {
    state.introShown = true;
    const name = localStorage.getItem("sela_name");
    if (name) setTimeout(() => whisper(`我记得你，${name}。`), 900);
  }

  // 进度显示
  const prog = $("#progress");
  if (lv.special) {
    prog.textContent = `第 ${lv.label} 号异闻`;
    prog.className = "progress special";
  } else {
    prog.textContent = `第 ${lv.label} 关 / 共 ${levels.length} 关`;
    prog.className = "progress";
  }

  $("#clueTitle").textContent = lv.title;
  $("#clueText").textContent = lv.scene;
  renderLexicon();

  const p = $("#puzzle");
  p.innerHTML = "";
  p.className = lv.special ? "special-mode" : "";

  if (lv.kind === "word") {
    $("#imgWrap").innerHTML = `<div class="img-placeholder"><div class="ph-icon">📖</div><div style="color:#8a7f6e;margin-top:6px;">词汇学习 · 请看右侧卡片</div></div>`;
    renderWord(lv, p);
  } else {
    renderSceneImage(lv);
    if (lv.kind === "translate") renderTranslate(lv, p);
    else renderInscription(lv, p);
  }
}

function renderLexicon() {
  const box = $("#lexicon");
  if (state.known.length === 0) {
    box.innerHTML = `<p class="empty">尚未解读任何词汇。<br>随着你破译石碑，这里会逐渐充实。</p>`;
    return;
  }
  box.innerHTML = state.known.map(w => `<div class="lex-item"><span class="sela">${w}</span><span class="cn">${LEXICON[w] || "?"}</span></div>`).join("");
}

/* ---------- 单词关 ---------- */
function renderWord(lv, p) {
  p.innerHTML = `
    <p style="color:#8a7f6e;font-size:14px;line-height:1.9;margin-bottom:14px;">观察每幅图片，在输入框中写下它旁边的塞拉语符号是什么意思。全部答对后进入下一关。</p>
    <div class="word-grid" id="wordGrid"></div>
    <div class="feedback" id="feedback"></div>
  `;
  const grid = $("#wordGrid");
  let correctCount = 0;

  lv.words.forEach(item => {
    const card = document.createElement("div");
    card.className = "word-card";

    const imgDiv = document.createElement("div");
    imgDiv.className = "word-img";
    const img = document.createElement("img");
    img.src = item.image;
    img.alt = item.imageAlt || item.word;
    img.onerror = () => {
      imgDiv.innerHTML = `<div class="word-img-ph"><div class="ph-icon">🖼</div><div class="ph-file">${item.image}</div><div>${item.imageHint || ""}</div></div>`;
    };
    imgDiv.appendChild(img);
    card.appendChild(imgDiv);

    const sela = document.createElement("div");
    sela.className = "word-sela";
    sela.textContent = item.word;
    card.appendChild(sela);

    const input = document.createElement("input");
    input.type = "text";
    input.className = "word-input";
    input.placeholder = "输入中文…";
    input.autocomplete = "off";
    input.spellcheck = false;
    card.appendChild(input);

    const btn = document.createElement("button");
    btn.className = "reveal-btn";
    btn.textContent = "确认";
    card.appendChild(btn);

    const fb = document.createElement("div");
    fb.className = "word-feedback";
    card.appendChild(fb);

    const accepts = item.accepts && item.accepts.length ? item.accepts : [item.cn];

    const check = () => {
      if (card.classList.contains("revealed")) return;
      const v = norm(input.value);
      if (!v) return;

      if (accepts.some(a => norm(a) === v)) {
        card.classList.add("revealed");
        input.value = item.cn;
        input.disabled = true;
        btn.style.display = "none";
        fb.className = "word-feedback good";
        fb.textContent = "✓ 正确";
        correctCount++;
        if (correctCount === lv.words.length) {
          setTimeout(() => finishLevel(lv), 500);
        }
      } else {
        fb.textContent = "不对，再想想图片里画的是什么。";
        input.classList.add("shake");
        setTimeout(() => input.classList.remove("shake"), 400);
      }
    };

    btn.onclick = check;
    input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });

    grid.appendChild(card);
  });

  const first = grid.querySelector(".word-input");
  if (first) first.focus();
}

/* ---------- 翻译关 ---------- */
function renderTranslate(lv, p) {
  let knownHTML = "";
  if (lv.known && lv.known.text) {
    knownHTML = `<div class="line"><span class="tag">已知</span><span class="sela">${lv.known.text}</span>${lv.known.cn ? `<span class="eq">=</span><span class="cn">${lv.known.cn}</span>` : ""}</div>`;
  }

  const hintHTML = lv.hint === null
    ? `<div class="no-hint">这一关没有提示。</div>`
    : `<button class="btn ghost" id="hintBtn">提示</button>`;

  p.innerHTML = `
    ${knownHTML}
    <div class="line"><span class="tag">待译</span><span class="sela" style="font-size:20px;">${lv.prompt}</span></div>
    <div class="input-row">
      <input type="text" id="answer" placeholder="输入中文翻译…" autocomplete="off" spellcheck="false">
      <button class="btn primary" id="submit">提交</button>
    </div>
    <div class="feedback" id="feedback"></div>
    ${hintHTML}
  `;

  const input = $("#answer");
  const submit = () => {
    const v = norm(input.value);
    if (!v) return;
    if (lv.accepts.some(a => norm(a) === v)) {
      $("#feedback").className = "feedback good";
      $("#feedback").textContent = "正确。";
      setTimeout(() => finishLevel(lv), 380);
    } else {
      $("#feedback").className = "feedback";
      $("#feedback").textContent = "不对。对照图片，想想每个词的位置。";
      input.classList.add("shake");
      setTimeout(() => input.classList.remove("shake"), 400);
    }
  };

  $("#submit").onclick = submit;
  input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });

  const hintBtn = $("#hintBtn");
  if (hintBtn) {
    hintBtn.onclick = () => {
      $("#feedback").className = "feedback";
      $("#feedback").textContent = "提示：" + lv.hint;
    };
  }

  input.focus();
}

/* ---------- 碑文关 ---------- */
function renderInscription(lv, p) {
  const draw = () => {
    const hintHTML = lv.hint === null
      ? `<div class="no-hint">这一关没有提示。</div>`
      : `<button class="btn ghost" id="hintBtn">提示</button>`;

    p.innerHTML = `
      <div class="line"><span class="tag">已知</span><span class="sela">${lv.known.text}</span><span class="eq">=</span><span class="cn">${lv.known.cn}</span></div>
      <div class="inscription" id="insc"></div>
      <div class="input-row">
        <input type="text" id="answer" placeholder="逐行翻译碑文…" autocomplete="off" spellcheck="false">
        <button class="btn primary" id="submit">提交</button>
      </div>
      <div class="feedback" id="feedback"></div>
      ${hintHTML}
    `;

    const insc = $("#insc");
    lv.lines.forEach((line, i) => {
      const d = document.createElement("div");
      d.className = "insc-line";
      if (i < state.inscStep) d.classList.add("done");
      if (i === state.inscStep) d.classList.add("active");
      d.innerHTML = `<span class="sela">${line.text}</span>`;
      if (i < state.inscStep) {
        const cn = document.createElement("span");
        cn.className = "cn";
        cn.textContent = state.inscAnswers[i];
        d.appendChild(cn);
      }
      insc.appendChild(d);
    });

    const input = $("#answer");
    const submit = () => {
      const v = norm(input.value);
      if (!v) return;
      const cur = lv.lines[state.inscStep];
      if (cur.accepts.some(a => norm(a) === v)) {
        state.inscAnswers.push(cur.accepts[0]);
        state.inscStep++;
        if (state.inscStep >= lv.lines.length) {
          $("#feedback").className = "feedback good";
          $("#feedback").textContent = "碑文全部译出。";
          setTimeout(() => finishLevel(lv), 500);
        } else {
          draw();
        }
      } else {
        $("#feedback").className = "feedback";
        $("#feedback").textContent = "这一行不对。注意语序，以及修饰词的位置。";
        input.classList.add("shake");
        setTimeout(() => input.classList.remove("shake"), 400);
      }
    };

    $("#submit").onclick = submit;
    input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });

    const hintBtn = $("#hintBtn");
    if (hintBtn) {
      hintBtn.onclick = () => {
        $("#feedback").className = "feedback";
        $("#feedback").textContent = "提示：语序是「（时态）—动词—主语—（修饰词）宾语」。";
      };
    }

    input.focus();
  };

  draw();
}

/* =========================================================
   过关
   ========================================================= */
function finishLevel(lv) {
  (lv.learned || []).forEach(w => {
    if (!state.known.includes(w)) state.known.push(w);
  });
  state.level++;
  save();
  showReveal(lv.reveal, () => {
    if (state.level >= LEVELS.length) renderEnding();
    else render();
  });
}

function showReveal(text, cb) {
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="reveal-box"><p>${text}</p><button class="btn primary">继续</button></div>`;
  overlay.querySelector("button").onclick = () => {
    overlay.remove();
    cb();
  };
  document.body.appendChild(overlay);
}

/* =========================================================
   随时重开
   ========================================================= */
function restartGame(skipConfirm) {
  const saveKey = state.secondRun ? "sela_save_2" : "sela_save";

  if (skipConfirm) {
    localStorage.removeItem(saveKey);
    location.reload();
    return;
  }

  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  overlay.innerHTML = `
    <div class="confirm-box">
      <p>确定要重新开始吗？<br>当前的进度会被清空。</p>
      <div class="confirm-actions">
        <button class="btn ghost" id="cancelRestart">取消</button>
        <button class="btn primary" id="confirmRestart">重开</button>
      </div>
    </div>
  `;
  overlay.querySelector("#cancelRestart").onclick = () => overlay.remove();
  overlay.querySelector("#confirmRestart").onclick = () => {
    localStorage.removeItem(saveKey);
    location.reload();
  };
  document.body.appendChild(overlay);
}

document.addEventListener("click", e => {
  if (e.target && e.target.id === "restartBtn") restartGame(false);
});

/* =========================================================
   结局
   ========================================================= */
function renderEnding() {
  const app = document.querySelector(".app");
  const name = localStorage.getItem("sela_name");

  // 二周目额外显示一行
  const nameLine = (state.secondRun && name)
    ? `<p class="right" style="margin-top:14px;">名字是：<span class="sela">${name}</span></p>`
    : "";

  app.innerHTML = `
    <div class="ending">
      <h1>遗 语 · 塞 拉</h1>
      <p>你读完了碑文。</p>
      <p class="ep">碑上写的，是一个完整的预言——</p>
      <div class="right">
        <p>古代两位神明，居住在高的塔上。</p>
        <p>唯一至高生命，曾在圣诞前夕降临。</p>
        <p>魔鬼迷惑人民，人民转变了信仰。</p>
        <p>如今神明得到复活，末日即将来临。</p>
        <p>神的侍者，将离开笼子。</p>
      </div>
      <p class="ep">你转身，准备离开。</p>
      <p>但石碑的背面，还刻着一个符号。</p>
      <p>你盯着它看了很久，终于认出——</p>
      <p class="right"><span class="sela">va mi ti</span>　我来这里。</p>
      <p class="ep">而落款的笔迹，和你自己的，一模一样。</p>
      ${nameLine}
      <button class="btn primary" id="toShadow">……</button>
    </div>
  `;

  $("#toShadow").onclick = () => showShadow();
}

/* =========================================================
   黑影结局
   ========================================================= */
function showShadow() {
  const app = document.querySelector(".app");
  app.innerHTML = `
    <div class="shadow-scene">
      <div class="shadow-figure"></div>
      <p class="shadow-line">我知道你不在这里。</p>
      <p class="shadow-line">你在对面。</p>
      <p class="shadow-line">签个名吧，我想记住你。</p>
      <div class="signature-box">
        <input type="text" id="signInput" maxlength="16" placeholder="写下你的名字…" autocomplete="off" spellcheck="false">
        <button class="btn primary" id="signBtn">签名</button>
      </div>
    </div>
  `;

  const input = $("#signInput");
  const btn = $("#signBtn");

  const doSign = () => {
    const name = input.value.trim();
    if (!name) {
      input.classList.add("shake");
      setTimeout(() => input.classList.remove("shake"), 400);
      return;
    }
    localStorage.setItem("sela_name", name);
    signAndRestart(name);
  };

  btn.onclick = doSign;
  input.addEventListener("keydown", e => { if (e.key === "Enter") doSign(); });
  setTimeout(() => input.focus(), 5800);
}

function signAndRestart(name) {
  const app = document.querySelector(".app");
  app.innerHTML = `
    <div class="shadow-scene">
      <div class="shadow-figure fading"></div>
      <p class="shadow-line" style="animation-delay: 0.4s;">我记住了，${name}。</p>
      <p class="shadow-line" style="animation-delay: 2s;">再见。</p>
      <button class="btn ghost" id="restartOnly" style="margin-top: 60px; opacity: 0; animation: shadowLine 1.4s 3.6s forwards;">重新开始</button>
    </div>
  `;

  $("#restartOnly").onclick = () => {
    localStorage.removeItem("sela_save_2");
    location.reload();
  };
}

/* =========================================================
   开发者模式（测试用）
   ---------------------------------------------------------
   URL 参数：
     ?dev=reset      清空所有存档，回到一周目
     ?dev=second     直接进入二周目，词典为空
     ?dev=god        直接进入二周目，词典填满（测试后期关卡用）
     ?dev=stage&n=3  直接跳到二周目第 3 关（0 起算）
     ?dev=1stage&n=3 直接跳到一周目第 3 关
   多个参数可叠加，如 ?dev=god&n=5
   ========================================================= */
function devMode() {
  const params = new URLSearchParams(location.search);
  const dev = params.get("dev");
  if (!dev) return;

  const n = parseInt(params.get("n") || "0", 10);
  const msg = [];

  // 重置
  if (dev === "reset" || dev === "all") {
    localStorage.removeItem("sela_save");
    localStorage.removeItem("sela_save_2");
    localStorage.removeItem("sela_name");
    msg.push("已清空所有存档");
  }

  // 进入二周目
  if (dev === "second" || dev === "god" || dev === "all") {
    localStorage.setItem("sela_name", "开发者");
    msg.push("已进入二周目");
  }

  // 填满词典
  if (dev === "god") {
    const known = Object.keys(LEXICON);
    localStorage.setItem("sela_save_2", JSON.stringify({ level: 0, known }));
    msg.push("词典已填满（" + known.length + " 个词）");
  }

  // 跳到指定关
  if (dev === "stage") {
    localStorage.setItem("sela_save_2", JSON.stringify({ level: n, known: [] }));
    msg.push("跳到二周目第 " + n + " 关");
  }
  if (dev === "1stage") {
    localStorage.setItem("sela_save", JSON.stringify({ level: n, known: [] }));
    msg.push("跳到一周目第 " + n + " 关");
  }

  if (msg.length) {
    console.log("%c[DEV]", "color:#c8a24a;font-weight:bold;", msg.join(" / "));
  }
}

devMode();

/* =========================================================
   启动
   ========================================================= */
load();
render();
</script>
</body>
